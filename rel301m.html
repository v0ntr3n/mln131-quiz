<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REL301m — Learn</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .kbd-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 700;
      width: 2rem;
      height: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.55rem;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(248, 250, 252, 0.9);
      color: #475569;
      flex-shrink: 0;
    }
    .dark .kbd-key {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(71, 85, 105, 0.7);
      color: #94a3b8;
    }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-card {
      animation: cardFadeIn 0.18s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Minimal Quizlet-Learn Style Header -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200/70 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <span class="font-bold text-base sm:text-lg tracking-tight">REL301m</span>
        <span id="saveStatusLabel" title="Auto-saved" class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
      </div>

      <nav aria-label="Study Modes" class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
        <button type="button" data-mode-tab="learn" class="mode-tab-btn px-4 py-2 rounded-lg text-sm sm:text-base font-semibold transition-all flex items-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>Learn</span>
        </button>
        <button type="button" data-mode-tab="exam" class="mode-tab-btn px-4 py-2 rounded-lg text-sm sm:text-base font-semibold transition-all flex items-center gap-2">
          <i data-lucide="timer" class="w-4 h-4"></i>
          <span>Test</span>
        </button>
        <button type="button" data-mode-tab="browse" class="mode-tab-btn px-4 py-2 rounded-lg text-sm sm:text-base font-semibold transition-all flex items-center gap-2">
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>List</span>
        </button>
      </nav>

      <div class="flex items-center gap-1">
        <button type="button" id="btnOpenOptionsModal" title="Learn Options" class="p-2 rounded-lg text-slate-500 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btnOpenBackupModal" title="Backup / Restore JSON" class="p-2 rounded-lg text-slate-500 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="download-cloud" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btnOpenResetModal" title="Reset progress" class="p-2 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btnToggleTheme" title="Light / Dark" class="p-2 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4"></i>
          <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- Compact Deck & Mastery Bar -->
    <section id="deckOverviewBar" class="space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5">
          <div id="deckPillsContainer" class="flex flex-wrap items-center gap-1.5"></div>
          <span id="activeDeckSourceLinks" class="text-xs text-indigo-600 dark:text-indigo-400"></span>
        </div>

        <div id="statusFilterPills" class="flex flex-wrap items-center gap-1">
          <button type="button" data-status-filter="all" class="status-pill px-2.5 py-1 rounded-lg text-xs font-semibold transition-colors">All</button>
          <button type="button" data-status-filter="unseen" class="status-pill px-2.5 py-1 rounded-lg text-xs font-semibold transition-colors">New <span id="statUnseenCount" class="font-mono opacity-75">0</span></button>
          <button type="button" data-status-filter="learning" class="status-pill px-2.5 py-1 rounded-lg text-xs font-semibold transition-colors">Familiar <span id="statLearningCount" class="font-mono opacity-75">0</span></button>
          <button type="button" data-status-filter="mastered" class="status-pill px-2.5 py-1 rounded-lg text-xs font-semibold transition-colors">Mastered <span id="statMasteredCount" class="font-mono opacity-75">0</span></button>
          <button type="button" data-status-filter="starred" class="status-pill px-2.5 py-1 rounded-lg text-xs font-semibold transition-colors">★ <span id="statStarredCount" class="font-mono opacity-75">0</span></button>
          <button type="button" data-status-filter="traps" title="Flagged exam traps & flawed keys" class="status-pill px-2.5 py-1 rounded-lg text-xs font-semibold transition-colors">⚠ <span id="statTrapsCount" class="font-mono opacity-75">0</span></button>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <div class="flex-1 h-2 bg-slate-200/80 dark:bg-slate-800 rounded-full overflow-hidden flex">
          <div id="barMastered" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
          <div id="barLearning" class="bg-indigo-400 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="statMasteryPercent" class="text-sm font-mono font-semibold text-slate-500 dark:text-slate-400 shrink-0">0%</span>
      </div>
    </section>

    <!-- ==================== VIEW 1: QUIZLET LEARN MODE (DEFAULT) ==================== -->
    <section id="viewLearn" class="space-y-3">
      <!-- Empty Filter State -->
      <div id="learnEmptyState" class="hidden bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-10 text-center space-y-3">
        <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-500 mx-auto"></i>
        <p class="text-sm font-semibold text-slate-600 dark:text-slate-300">No cards in this filter</p>
        <button type="button" id="btnResetLearnFilter" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">Show All</button>
      </div>

      <!-- Active Learn Workspace -->
      <div id="learnWorkspace" class="space-y-3">
        <!-- Quizlet Learn Segmented Round Progress Bar -->
        <div class="flex items-center gap-3 px-1">
          <span id="learnRoundBadge" class="px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-mono text-xs sm:text-sm font-bold shrink-0">R1</span>
          <div class="flex-1 h-2.5 bg-slate-200/80 dark:bg-slate-800 rounded-full overflow-hidden">
            <div id="learnRoundBar" class="h-full bg-indigo-600 dark:bg-indigo-500 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <span id="learnRoundProgressText" class="font-mono text-sm font-semibold text-slate-500 dark:text-slate-400 shrink-0">0 / 7</span>
          <button type="button" id="btnLearnNewRound" title="Shuffle new round" class="p-1.5 rounded-lg hover:bg-slate-200/70 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
            <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Quizlet Learn Main Question Card -->
        <div id="learnQuestionCard" class="animate-card bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/90 dark:border-slate-800 p-6 sm:p-10 lg:p-12 shadow-sm space-y-8">
          <!-- Card Meta Row -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span id="learnSetBadge" class="font-mono text-sm font-semibold text-indigo-600 dark:text-indigo-400"></span>
              <!-- Quizlet 2-dot Mastery Indicator -->
              <span id="learnMasteryDots" class="inline-flex items-center gap-1" title="Mastery progress"></span>
              <span id="learnTrapBadge" class="hidden px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300"></span>
              <span id="learnRetryBadge" class="hidden px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">Try again</span>
            </div>

            <div class="flex items-center gap-1">
              <button type="button" id="btnLearnSpeak" title="Read aloud" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="volume-2" class="w-4 h-4"></i>
              </button>
              <button type="button" id="btnLearnStar" title="Star (S)" class="p-1.5 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="star" class="w-4 h-4"></i>
              </button>
              <a id="learnSourceLink" title="Quizlet source" href="https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/" target="_blank" rel="noopener noreferrer" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>

          <!-- Question Stem -->
          <div class="min-h-[104px] flex items-center">
            <h2 id="learnQuestionText" class="text-lg sm:text-2xl lg:text-[26px] font-bold leading-snug text-slate-900 dark:text-white"></h2>
          </div>

          <!-- Quizlet Learn 2x2 Answer Grid -->
          <div class="space-y-3.5">
            <div class="flex items-center justify-between text-sm text-slate-400">
              <span id="learnPromptHint" class="font-medium">Choose matching answer</span>
              <button type="button" id="btnLearnDontKnow" class="font-semibold text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Don't know?</button>
            </div>
            <div id="learnOptionsContainer" class="grid grid-cols-1 gap-3"></div>
          </div>

          <!-- Instant Feedback Bar -->
          <div id="learnFeedbackBox" class="hidden rounded-xl p-3.5 border flex items-center justify-between gap-3">
            <div class="space-y-0.5 min-w-0">
              <div id="learnFeedbackTitle" class="font-bold text-xs sm:text-sm"></div>
              <p id="learnFeedbackDetail" class="text-xs leading-relaxed opacity-90"></p>
            </div>
            <button type="button" id="btnLearnContinue" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shrink-0">Continue ↵</button>
          </div>
        </div>

        <!-- Quizlet Learn End-of-Round Checkpoint -->
        <div id="learnRoundSummary" class="hidden animate-card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm space-y-5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                <i data-lucide="trophy" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="text-base sm:text-lg font-bold" id="learnCompleteHeading">Round complete!</h3>
                <p class="text-xs font-mono text-slate-500" id="learnCompleteSubtext"></p>
              </div>
            </div>
            <div class="flex gap-2">
              <button type="button" id="btnLearnNextBatch" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs sm:text-sm shadow-sm">Next round ↵</button>
              <button type="button" id="btnLearnSwitchExam" class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 font-semibold text-xs sm:text-sm">Test</button>
            </div>
          </div>

          <!-- Compact Recap of Cards in Round -->
          <div id="learnRoundRecapList" class="divide-y divide-slate-100 dark:divide-slate-800 max-h-64 overflow-y-auto"></div>
        </div>
      </div>
    </section>

    <!-- ==================== VIEW 2: MOCK TEST (FE SIMULATOR) ==================== -->
    <section id="viewExam" class="hidden space-y-4">
      <div id="examSetupPanel" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-4">
          <h2 class="text-base font-bold">Test (FE)</h2>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <select id="selExamDeck" aria-label="Deck" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs sm:text-sm font-medium">
              <option value="all_rl">All (195)</option>
              <option value="traps_only">⚠ Exam Traps Only</option>
              <option value="exam_rl">Exam RL (50)</option>
              <option value="su25_rl">SU25 (50)</option>
              <option value="sp26_fe">SP26 (50)</option>
              <option value="su26_fe">SU26 (50)</option>
              <option value="weak_only">Familiar / Wrong</option>
            </select>

            <select id="selExamCount" aria-label="Questions" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs sm:text-sm font-medium">
              <option value="15">15 Qs</option>
              <option value="30">30 Qs</option>
              <option value="50" selected>50 Qs (FE)</option>
              <option value="195">All</option>
            </select>

            <select id="selExamTimer" aria-label="Timer" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs sm:text-sm font-medium">
              <option value="15">15 min</option>
              <option value="45">45 min</option>
              <option value="60" selected>60 min</option>
              <option value="0">Untimed</option>
            </select>
          </div>

          <div class="flex flex-wrap items-center gap-4 text-xs font-medium text-slate-600 dark:text-slate-300">
            <label class="inline-flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="chkExamShuffleQ" checked class="rounded text-indigo-600" />
              <span>Shuffle Qs</span>
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="chkExamShuffleOpt" class="rounded text-indigo-600" />
              <span>Shuffle A-D</span>
            </label>
          </div>

          <div id="examSetupNotice" class="hidden p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-xs text-amber-800 dark:text-amber-300"></div>

          <button type="button" id="btnStartExam" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm inline-flex items-center gap-2">
            <i data-lucide="play" class="w-4 h-4"></i>
            <span>Start Test</span>
          </button>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-3">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
            <span>History</span>
            <span id="examHistoryCount" class="font-mono">0</span>
          </div>
          <div id="examHistoryList" class="space-y-2 max-h-52 overflow-y-auto"></div>
        </div>
      </div>

      <!-- Active Exam -->
      <div id="examActivePanel" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 items-start">
        <div class="md:col-span-2 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 sm:p-9 shadow-sm space-y-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="examQIndexBadge" class="font-mono font-bold text-xs text-indigo-600 dark:text-indigo-400">1 / 50</span>
              <span id="examQSetBadge" class="text-xs text-slate-400"></span>
            </div>
            <button type="button" id="btnExamFlag" class="px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-200 dark:border-slate-700 flex items-center gap-1">
              <i data-lucide="flag" class="w-3.5 h-3.5"></i>
              <span id="examFlagLabel">Flag</span>
            </button>
          </div>

          <h2 id="examQuestionText" class="text-lg sm:text-2xl font-bold leading-snug"></h2>
          <div id="examOptionsList" class="grid grid-cols-1 gap-3"></div>

          <div class="pt-2 flex items-center justify-between">
            <button type="button" id="btnExamPrev" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button type="button" id="btnExamNext" class="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white disabled:opacity-40">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <span id="examTimerDisplay" class="font-mono font-bold text-base text-indigo-600 dark:text-indigo-400">60:00</span>
            <div class="text-xs font-mono text-slate-500">
              <span id="examAnsweredCount">0/50</span> · ⚑ <span id="examFlaggedCount">0</span>
            </div>
          </div>

          <div id="examPaletteGrid" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-5 gap-1 max-h-56 overflow-y-auto"></div>

          <div class="flex gap-2 pt-1">
            <button type="button" id="btnSubmitExamRequest" class="flex-1 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs">Submit</button>
            <button type="button" id="btnCancelExam" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Quit</button>
          </div>
        </div>
      </div>

      <!-- Exam Results -->
      <div id="examResultPanel" class="hidden space-y-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 id="examResultScoreHeadline" class="text-2xl font-extrabold">8.6 / 10</h2>
            <p id="examResultMeta" class="text-xs font-mono text-slate-500 mt-0.5"></p>
          </div>
          <div class="flex gap-2">
            <button type="button" id="btnPracticeWrongExam" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs">Learn Missed</button>
            <button type="button" id="btnNewExamSetup" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs">New Test</button>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button type="button" data-exam-review-filter="all" class="exam-rev-pill px-3 py-1 rounded-lg text-xs font-semibold">All</button>
          <button type="button" data-exam-review-filter="wrong" class="exam-rev-pill px-3 py-1 rounded-lg text-xs font-semibold">Missed</button>
          <button type="button" data-exam-review-filter="flagged" class="exam-rev-pill px-3 py-1 rounded-lg text-xs font-semibold">Flagged</button>
        </div>

        <div id="examReviewCardsList" class="space-y-2.5"></div>
      </div>
    </section>

    <!-- ==================== VIEW 3: BROWSE LIST ==================== -->
    <section id="viewBrowse" class="hidden space-y-3">
      <div class="flex items-center gap-2 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
        <input type="search" id="browseSearchInput" placeholder="Search 195 unique questions..." class="flex-1 bg-transparent text-sm focus:outline-none" />
        <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-500 cursor-pointer select-none shrink-0">
          <input type="checkbox" id="chkBrowseHideAnswers" class="rounded text-indigo-600" />
          <span>Hide Ans</span>
        </label>
        <span id="browseResultCount" class="text-xs font-mono text-slate-400 shrink-0 pl-1">195</span>
      </div>

      <div id="browseCardsContainer" class="space-y-2.5"></div>

      <div id="browsePaginationBar" class="flex items-center justify-between px-1 pt-1">
        <button type="button" id="btnBrowsePrevPage" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 disabled:opacity-40">

C": "Both", "D": "Neither"}, "answer": "B", "explanation": "Continuing tasks run indefinitely without a distinct endpoint.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/", "alsoIn": "SU25 #40"}, {"id": "exam_rl_34", "setId": "exam_rl", "setTitle": "Exam RL", "num": 34, "question": "Primary role of a reward in RL?", "options": {"A": "Feedback on actions", "B": "Store past actions", "C": "Initialize state", "D": "Determine learning speed"}, "answer": "A", "explanation": "Rewards provide immediate numerical feedback on how good an action was.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_35", "setId": "exam_rl", "setTitle": "Exam RL", "num": 35, "question": "Effect of high discrimination ability on accuracy in learning?", "options": {"A": "Decreases learning efficiency", "B": "Frequent recall errors", "C": "Enhances precision of responses", "D": "Reduces generalization"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_36", "setId": "exam_rl", "setTitle": "Exam RL", "num": 36, "question": "Main advantage of linear function approximation in RL?", "options": {"A": "Perfect accuracy", "B": "Computationally inexpensive and easy to implement", "C": "Ensures optimal convergence", "D": "Eliminates exploration"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_37", "setId": "exam_rl", "setTitle": "Exam RL", "num": 37, "question": "In Semi-Gradient TD, typical approach to updating parameters?", "options": {"A": "Full gradient", "B": "Stochastic gradient of value function", "C": "Bellman error multiplied by eligibility trace", "D": "Monte Carlo estimate"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_38", "setId": "exam_rl", "setTitle": "Exam RL", "num": 38, "question": "What does Critic in Actor-Critic estimate?", "options": {"A": "State-action value function", "B": "Probability distribution of actions", "C": "Reward function", "D": "Discounted cumulative reward"}, "answer": "A", "explanation": "Estimates state-action value function (or state value function).", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_39", "setId": "exam_rl", "setTitle": "Exam RL", "num": 39, "question": "In Sarsa with function approximation, what updates weights?", "options": {"A": "Random selection", "B": "Gradient descent", "C": "Tabular methods", "D": "Fixed weights"}, "answer": "B", "explanation": "Function approximation uses gradient descent to adjust weights.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_40", "setId": "exam_rl", "setTitle": "Exam RL", "num": 40, "question": "What happens as softmax temperature approaches infinity?", "options": {"A": "More deterministic", "B": "More stochastic", "C": "Completely random", "D": "Independent of state"}, "answer": "C", "explanation": "High temperature flattens the Boltzmann distribution into a uniform random choice.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_41", "setId": "exam_rl", "setTitle": "Exam RL", "num": 41, "question": "Primary difference between TD and Monte Carlo?", "options": {"A": "TD model-free, MC model-based", "B": "TD bootstraps, MC uses full episode returns", "C": "TD updates at episode end, MC at each step", "D": "TD uses state aggregation, MC does not"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_42", "setId": "exam_rl", "setTitle": "Exam RL", "num": 42, "question": "Which method is generally applicable and easy to use with function approximation?", "options": {"A": "Monte Carlo methods", "B": "Epsilon greedy", "C": "Q-learning", "D": "Policy gradient"}, "answer": "C", "explanation": "Q-learning (and temporal difference methods) are commonly used with function approximation.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/", "trapLabel": "Disputed Key", "trapNote": "Off-policy Q-learning + FA is Sutton & Barto's unstable 'Deadly Triad', though DQN popularized it — exam keys [C]."}, {"id": "exam_rl_43", "setId": "exam_rl", "setTitle": "Exam RL", "num": 43, "question": "In Actor-Critic with Softmax Policies, how is action chosen?", "options": {"A": "Highest probability", "B": "Randomly sampled from distribution", "C": "Lowest probability", "D": "Maximum advantage"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_44", "setId": "exam_rl", "setTitle": "Exam RL", "num": 44, "question": "How does generalization benefit learning?", "options": {"A": "Apply learned knowledge to new varied situations", "B": "Restrict knowledge to specific contexts", "C": "Minimize chances of mistakes", "D": "Reduce need for practice"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_45", "setId": "exam_rl", "setTitle": "Exam RL", "num": 45, "question": "Primary goal of coarse coding?", "options": {"A": "Minimize number of states", "B": "Reduce computational complexity using fewer resources", "C": "Generalize state representation using overlapping features", "D": "Ensure exact state representation"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_46", "setId": "exam_rl", "setTitle": "Exam RL", "num": 46, "question": "Common initialization strategy for neural network weights?", "options": {"A": "All ones", "B": "Randomly sample normal distribution with small variance", "C": "Fixed weights for all neurons", "D": "Based on previous training"}, "answer": "B", "explanation": "Or Xavier/He initialization.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_47", "setId": "exam_rl", "setTitle": "Exam RL", "num": 47, "question": "What does exploration in Gaussian policies rely on?", "options": {"A": "Random noise added to mean action", "B": "Uniform random sampling", "C": "Fixed exploration rate", "D": "Adaptive exploration based on reward feedback"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_48", "setId": "exam_rl", "setTitle": "Exam RL", "num": 48, "question": "Key advantage of Semi-Gradient TD over Gradient TD in policy evaluation?", "options": {"A": "Requires fewer computational resources", "B": "Converges faster", "C": "More stable with function approximation", "D": "Guarantees optimal convergence"}, "answer": "A", "explanation": "Requires fewer computational resources and offers simpler implementation.", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_49", "setId": "exam_rl", "setTitle": "Exam RL", "num": 49, "question": "What does average reward in RL represent?", "options": {"A": "Total reward during an episode", "B": "Reward at each step", "C": "Mean reward over multiple episodes", "D": "Maximum reward achievable"}, "answer": "C", "explanation": "Mean reward over multiple episodes (or per-step average in continuing tasks).", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "exam_rl_50", "setId": "exam_rl", "setTitle": "Exam RL", "num": 50, "question": "Technique alongside epsilon-greedy to ensure epsilon decreases appropriately over time?", "options": {"A": "Exponential decay", "B": "Linear scaling", "C": "Fixed epsilon value", "D": "Random adjustment"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/1238874494/rel301m-exam-rl-flashcards/"}, {"id": "su25_rl_1", "setId": "su25_rl", "setTitle": "SU25", "num": 1, "question": "Which algorithm is commonly used for off-policy learning in reinforcement learning?", "options": {"A": "Q-learning", "B": "SARSA", "C": "Deep Q-Network (DQN)", "D": "Policy Gradient"}, "answer": "A", "explanation": "Q-learning. DQN (C) cũng là off-policy, nên câu này có hai lựa chọn hợp lý.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "trapLabel": "Multi-Correct", "trapNote": "[C] DQN is also off-policy, but exam keys foundational tabular [A] Q-learning."}, {"id": "su25_rl_2", "setId": "su25_rl", "setTitle": "SU25", "num": 2, "question": "What is one advantage of Temporal Difference (TD) methods over Dynamic Programming (DP) and Monte Carlo methods?", "options": {"A": "TD methods are guaranteed to converge to the optimal solution.", "B": "TD methods do not require knowledge of the complete environment dynamics.", "C": "TD methods are computationally less expensive.", "D": "TD methods can handle only episodic tasks efficiently."}, "answer": "B", "explanation": "TD học từ trải nghiệm mà không cần mô hình động lực đầy đủ (phân biệt với DP), đồng thời cập nhật trước khi episode kết thúc (phân biệt với Monte Carlo).", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "trapLabel": "Overlap Trap", "trapNote": "Monte Carlo is also model-free; [B] beats DP and A/C/D are false — pick [B]."}, {"id": "su25_rl_3", "setId": "su25_rl", "setTitle": "SU25", "num": 3, "question": "What type of learning method is Monte Carlo prediction classified as?", "options": {"A": "Supervised learning", "B": "Unsupervised learning", "C": "Semi-supervised learning", "D": "Reinforcement learning"}, "answer": "D", "explanation": "Reinforcement learning.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_4", "setId": "su25_rl", "setTitle": "SU25", "num": 4, "question": "Which of the following is a characteristic of temporal-difference learning algorithms?", "options": {"A": "They require labeled data for training.", "B": "They learn from delayed rewards.", "C": "They are only applicable in stationary environments.", "D": "They rely solely on a pre-defined set of rules."}, "answer": "B", "explanation": "Học từ phần thưởng đến trễ.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_5", "setId": "su25_rl", "setTitle": "SU25", "num": 5, "question": "Which of the following statements about Monte Carlo methods is true?", "options": {"A": "Monte Carlo methods require knowledge of the environment's model.", "B": "Monte Carlo methods update action values incrementally during an episode.", "C": "Monte Carlo methods update action values only at the end of an episode.", "D": "Monte Carlo methods can only be applied to deterministic environments."}, "answer": "C", "explanation": "Monte Carlo cập nhật sau khi episode kết thúc, khi đã biết return.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_6", "setId": "su25_rl", "setTitle": "SU25", "num": 6, "question": "Why is maintaining exploration important in Monte-Carlo methods?", "options": {"A": "To ensure rapid convergence", "B": "To prevent the algorithm from getting stuck in local optima", "C": "To reduce memory usage", "D": "To increase the speed of computation"}, "answer": "B", "explanation": "Khám phá giúp tránh mắc kẹt với hành động dưới tối ưu do ước lượng ban đầu.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_7", "setId": "su25_rl", "setTitle": "SU25", "num": 7, "question": "Which of the following statements is true regarding the update rule of Expected Sarsa?", "options": {"A": "It only updates based on the greedy action", "B": "It updates based on a weighted sum of Q-values for all possible actions", "C": "It requires the entire model of the environment", "D": "It updates based on the worst possible action"}, "answer": "B", "explanation": "Expected SARSA lấy tổng các Q-value có trọng số theo xác suất hành động.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_8", "setId": "su25_rl", "setTitle": "SU25", "num": 8, "question": "What is the primary objective of Random Tabular Q-planning in reinforcement learning?", "options": {"A": "To find the shortest path in a graph", "B": "To estimate the value function for a policy", "C": "To optimize the policy for better future rewards", "D": "To model the environment dynamics"}, "answer": "C", "explanation": "Dùng mô hình mô phỏng trải nghiệm để cập nhật Q và cải thiện chính sách.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_9", "setId": "su25_rl", "setTitle": "SU25", "num": 9, "question": "What distinguishes Temporal Difference (TD) methods from Monte Carlo methods regarding the handling of incomplete episodes?", "options": {"A": "TD methods require complete episodes for updating values.", "B": "TD methods update values based on incomplete episodes.", "C": "TD methods cannot handle incomplete episodes efficiently.", "D": "TD methods do not rely on experiences for learning."}, "answer": "B", "explanation": "TD cập nhật được ngay khi episode chưa kết thúc.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "alsoIn": "SP26 #26"}, {"id": "su25_rl_10", "setId": "su25_rl", "setTitle": "SU25", "num": 10, "question": "How does Expected Sarsa reduce the variance in Q-value updates compared to Q-learning?", "options": {"A": "By using a fixed learning rate.", "B": "By averaging over all possible actions.", "C": "By always selecting the action with the highest Q-value.", "D": "By ignoring the reward signal."}, "answer": "B", "explanation": "Lấy kỳ vọng theo phân phối hành động kế tiếp (giảm phương sai so với SARSA lấy mẫu).", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "trapLabel": "Wording Trap", "trapNote": "Expected SARSA reduces action-sampling variance vs. SARSA (Q-learning uses max) — exam keys [B]."}, {"id": "su25_rl_11", "setId": "su25_rl", "setTitle": "SU25", "num": 11, "question": "How can overfitting be addressed in machine learning models?", "options": {"A": "By reducing the complexity of the model", "B": "By increasing the complexity of the model", "C": "By ignoring the validation data", "D": "By introducing more noise into the training data"}, "answer": "A", "explanation": "Giảm độ phức tạp của mô hình.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_12", "setId": "su25_rl", "setTitle": "SU25", "num": 12, "question": "In the SARSA algorithm, what role does the learning rate (α) play?", "options": {"A": "It determines how much new information overrides the old information.", "B": "It sets the probability of taking a random action.", "C": "It defines the discount factor for future rewards.", "D": "It specifies the exploration-exploitation trade-off."}, "answer": "A", "explanation": "Learning rate α quyết định mức thông tin mới thay đổi ước lượng cũ.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_13", "setId": "su25_rl", "setTitle": "SU25", "num": 13, "question": "What is the primary purpose of Dyna Architecture?", "options": {"A": "To develop operating systems", "B": "To design scalable web servers", "C": "To model complex dynamic systems", "D": "To manage database transactions"}, "answer": "C", "explanation": "Dyna kết hợp học trực tiếp, học mô hình môi trường và lập kế hoạch từ mô hình đó.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "alsoIn": "SP26 #29"}, {"id": "su25_rl_14", "setId": "su25_rl", "setTitle": "SU25", "num": 14, "question": "What does Temporal Difference (TD) learning combine?", "options": {"A": "Monte Carlo methods and dynamic programming", "B": "Supervised learning and unsupervised learning", "C": "Gradient descent and stochastic gradient descent", "D": "Neural networks and decision trees"}, "answer": "A", "explanation": "Kết hợp học từ mẫu của Monte Carlo và cập nhật dựa vào ước lượng tiếp theo của DP.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_15", "setId": "su25_rl", "setTitle": "SU25", "num": 15, "question": "In Q-learning, what role does the learning rate (α) play in the update rule?", "options": {"A": "It determines how much the current Q-value is updated.", "B": "It determines how often the policy is changed.", "C": "It sets the exploration rate.", "D": "It sets the discount factor for future rewards."}, "answer": "A", "explanation": "α xác định mức điều chỉnh Q hiện tại.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_16", "setId": "su25_rl", "setTitle": "SU25", "num": 16, "question": "What is one of the main challenges when using distribution models in reinforcement learning?", "options": {"A": "High variance in action selection.", "B": "The need for large amounts of interaction data.", "C": "Difficulty in accurately modeling the environment's dynamics.", "D": "Slow convergence to the optimal policy."}, "answer": "C", "explanation": "Khó mô hình hóa chính xác động lực môi trường.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_17", "setId": "su25_rl", "setTitle": "SU25", "num": 17, "question": "Which of the following is an advantage of off-policy learning?", "options": {"A": "It requires less computational resources", "B": "It guarantees convergence to the optimal policy", "C": "It allows learning from non-optimal behavior", "D": "It eliminates the need for exploration entirely"}, "answer": "C", "explanation": "Có thể học từ hành vi chưa tối ưu.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_18", "setId": "su25_rl", "setTitle": "SU25", "num": 18, "question": "What is the main objective of the Q-learning algorithm?", "options": {"A": "To minimize the state-action pair values", "B": "To maximize the total reward over time", "C": "To minimize the exploration rate", "D": "To maximize the number of actions taken"}, "answer": "B", "explanation": "Tối đa hóa tổng phần thưởng kỳ vọng theo thời gian.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_19", "setId": "su25_rl", "setTitle": "SU25", "num": 19, "question": "What does the \"difference\" in temporal-difference learning refer to?", "options": {"A": "The difference between rewards and penalties", "B": "The difference between observed and predicted values", "C": "The difference between input and output data", "D": "The difference between model parameters"}, "answer": "B", "explanation": "Sai số giữa mục tiêu TD và giá trị dự đoán hiện tại.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_20", "setId": "su25_rl", "setTitle": "SU25", "num": 20, "question": "Which technique in reinforcement learning allows learning from historical data while following a different policy?", "options": {"A": "On-policy learning", "B": "Off-policy learning", "C": "Model-based learning", "D": "Temporal Difference learning"}, "answer": "B", "explanation": "Off-policy learning.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_21", "setId": "su25_rl", "setTitle": "SU25", "num": 21, "question": "What does state aggregation involve in reinforcement learning?", "options": {"A": "Combining similar states into groups to reduce the dimensionality of the state space.", "B": "Separating dissimilar states to increase the granularity of the state space.", "C": "Ignoring certain states in the environment to simplify the learning process.", "D": "Converting continuous state spaces into discrete state spaces."}, "answer": "A", "explanation": "Gộp các trạng thái tương tự thành nhóm.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_22", "setId": "su25_rl", "setTitle": "SU25", "num": 22, "question": "Which of the following is a characteristic of states represented by coarse coding?", "options": {"A": "Each state is represented by a unique, non-overlapping feature", "B": "States are represented by overlapping features, allowing for generalization", "C": "States are ignored and only actions are considered", "D": "Each state is treated as a separate entity with no generalization"}, "answer": "B", "explanation": "Dùng các đặc trưng chồng lấn để khái quát giữa các trạng thái.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_23", "setId": "su25_rl", "setTitle": "SU25", "num": 23, "question": "What is a primary challenge when setting up Tile Coding?", "options": {"A": "Ensuring non-overlapping tiles", "B": "Selecting the number and size of tiles", "C": "Finding the right discount factor", "D": "Balancing exploration and exploitation"}, "answer": "B", "explanation": "Chọn số lượng và kích thước tile.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_24", "setId": "su25_rl", "setTitle": "SU25", "num": 24, "question": "Which of the following methods is NOT typically used to learn the parameters of a Gaussian policy?", "options": {"A": "Maximum likelihood estimation", "B": "Policy gradient methods", "C": "Q-Learning", "D": "Actor-Critic methods"}, "answer": "C", "explanation": "Q-learning không trực tiếp học tham số của chính sách Gaussian.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_25", "setId": "su25_rl", "setTitle": "SU25", "num": 25, "question": "When using Epsilon-greedy with function approximation, what role does the function approximator play?", "options": {"A": "It generates the random exploration rate", "B": "It approximates the Q-values for given states and actions", "C": "It determines when to switch between exploration and exploitation", "D": "It sets the value of epsilon"}, "answer": "B", "explanation": "Xấp xỉ Q cho từng cặp trạng thái-hành động.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_26", "setId": "su25_rl", "setTitle": "SU25", "num": 26, "question": "What is a parameterized function in the context of reinforcement learning?", "options": {"A": "A function that takes no inputs and outputs a constant value.", "B": "A function that uses parameters (weights) to approximate another function.", "C": "A function that always returns the same value regardless of inputs.", "D": "A function that randomly changes its parameters during training."}, "answer": "B", "explanation": "Hàm dùng các tham số (trọng số) để xấp xỉ một hàm khác.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_27", "setId": "su25_rl", "setTitle": "SU25", "num": 27, "question": "What role does the discount factor play in Semi-Gradient TD learning?", "options": {"A": "It determines the rate of eligibility trace decay", "B": "It controls the influence of future rewards on the updates", "C": "It sets the exploration-exploitation trade-off", "D": "It adjusts the learning rate dynamically during training"}, "answer": "B", "explanation": "Hệ số chiết khấu điều chỉnh ảnh hưởng của phần thưởng tương lai.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_28", "setId": "su25_rl", "setTitle": "SU25", "num": 28, "question": "What is the significance of the average reward in reinforcement learning?", "options": {"A": "It indicates the maximum achievable reward in an environment", "B": "It helps in evaluating the performance of a learning agent over time", "C": "It represents the instantaneous reward received at each time step", "D": "It measures the variance in reward distribution"}, "answer": "B", "explanation": "Đánh giá hiệu suất dài hạn bằng phần thưởng trung bình trên mỗi bước.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_29", "setId": "su25_rl", "setTitle": "SU25", "num": 29, "question": "In coarse coding, what is the effect of having overlapping regions?", "options": {"A": "It increases the complexity of the representation", "B": "It reduces the chance of generalization across similar states", "C": "It allows for better generalization and smoother function approximation", "D": "It eliminates the need for exploration in reinforcement learning"}, "answer": "C", "explanation": "Các vùng chồng lấn giúp khái quát tốt hơn và xấp xỉ mượt hơn.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_30", "setId": "su25_rl", "setTitle": "SU25", "num": 30, "question": "Which of the following methods combines linear function approximation with policy improvement?", "options": {"A": "Policy Gradient Methods", "B": "Value Iteration", "C": "Actor-Critic Methods", "D": "Tabular Q-Learning"}, "answer": "C", "explanation": "Actor-Critic: Critic dùng hàm xấp xỉ tuyến tính và Actor cải thiện chính sách.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_31", "setId": "su25_rl", "setTitle": "SU25", "num": 31, "question": "In which type of environments is state aggregation particularly useful?", "options": {"A": "Environments with a very small state space.", "B": "Environments with deterministic transitions.", "C": "Environments with a very large or continuous state space.", "D": "Environments with no reward structure."}, "answer": "C", "explanation": "Môi trường có không gian trạng thái rất lớn hoặc liên tục.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "alsoIn": "SU26 #40"}, {"id": "su25_rl_32", "setId": "su25_rl", "setTitle": "SU25", "num": 32, "question": "How are the actor and critic networks updated in Actor-Critic with Softmax Policies?", "options": {"A": "Only the actor network is updated", "B": "Only the critic network is updated", "C": "Both the actor and critic networks are updated simultaneously", "D": "The networks are updated independently"}, "answer": "C", "explanation": "Cả actor và critic đều được cập nhật trong quá trình học.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_33", "setId": "su25_rl", "setTitle": "SU25", "num": 33, "question": "What role does the critic play in Actor-Critic with Softmax Policies?", "options": {"A": "It learns the policy function", "B": "It calculates the probability distribution over actions", "C": "It evaluates the quality of the policy chosen by the actor", "D": "It determines the exploration rate"}, "answer": "C", "explanation": "Critic đánh giá chính sách của actor.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_34", "setId": "su25_rl", "setTitle": "SU25", "num": 34, "question": "Which of the following is NOT a method for solving MDPs?", "options": {"A": "Dynamic Programming", "B": "Monte Carlo Methods", "C": "Temporal Difference Learning", "D": "Stochastic Gradient Descent"}, "answer": "D", "explanation": "Stochastic Gradient Descent là thuật toán tối ưu tổng quát.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_35", "setId": "su25_rl", "setTitle": "SU25", "num": 35, "question": "How does the flexibility of the Policy Iteration Framework contribute to robustness?", "options": {"A": "By limiting the diversity of policies explored", "B": "By allowing for rapid convergence to a single optimal policy", "C": "By enabling adaptation to varying conditions or goals", "D": "None of the above"}, "answer": "C", "explanation": "Khung lặp chính sách cho phép thích ứng khi điều kiện hoặc mục tiêu thay đổi.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_36", "setId": "su25_rl", "setTitle": "SU25", "num": 36, "question": "In the context of the multi-armed bandit problem, what does the term \"exploitation\" refer to?", "options": {"A": "Trying out different arms to gather information", "B": "Using the known information to select the best arm", "C": "Ignoring the past rewards and trying new strategies", "D": "Allocating equal time to all arms"}, "answer": "B", "explanation": "Dùng thông tin đã biết để chọn cần gạt có giá trị ước tính cao nhất.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_37", "setId": "su25_rl", "setTitle": "SU25", "num": 37, "question": "What happens if the value function of a policy converges during Iterative Policy Evaluation?", "options": {"A": "The optimal policy is achieved", "B": "The value function becomes infinite", "C": "The policy becomes deterministic", "D": "The policy evaluation process stops"}, "answer": "D", "explanation": "Dừng bước đánh giá chính sách khi giá trị đã hội tụ.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_38", "setId": "su25_rl", "setTitle": "SU25", "num": 38, "question": "Which function is typically used to represent the action value in reinforcement learning?", "options": {"A": "Reward function (R)", "B": "Value function (V)", "C": "Policy function (π)", "D": "Q-function (Q)"}, "answer": "D", "explanation": "Hàm Q biểu diễn giá trị hành động.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_39", "setId": "su25_rl", "setTitle": "SU25", "num": 39, "question": "How does hyperbolic discounting differ from exponential discounting?", "options": {"A": "Hyperbolic discounting values future rewards more than exponential discounting.", "B": "Exponential discounting values future rewards more than hyperbolic discounting.", "C": "Both discount future rewards equally.", "D": "Hyperbolic discounting is not related to time preference."}, "answer": "A", "explanation": "Chiết khấu hyperbol giảm chậm hơn ở tương lai xa nên định giá phần thưởng xa cao hơn chiết khấu mũ.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_41", "setId": "su25_rl", "setTitle": "SU25", "num": 41, "question": "What does the action value Q(s,a) represent in reinforcement learning?", "options": {"A": "The probability of transitioning to state s from state a", "B": "The expected return (total future reward) of taking action a in state s", "C": "The immediate reward received after taking action a", "D": "The average time it takes to transition from state s to state a"}, "answer": "B", "explanation": "Return kỳ vọng khi chọn a tại s, sau đó tiếp tục theo chính sách đang xét.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_42", "setId": "su25_rl", "setTitle": "SU25", "num": 42, "question": "Which notation is commonly used to represent the action-value function?", "options": {"A": "V(s)", "B": "R(s, a)", "C": "Q(s, a)", "D": "P(a | s)"}, "answer": "C", "explanation": "Q(s,a).", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_43", "setId": "su25_rl", "setTitle": "SU25", "num": 43, "question": "In Policy Evaluation, what is the objective function typically used?", "options": {"A": "Bellman Equation", "B": "Logistic Regression", "C": "Cost Function", "D": "Gradient Descent"}, "answer": "A", "explanation": "Phương trình kỳ vọng Bellman mà hàm giá trị của chính sách phải thỏa.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_44", "setId": "su25_rl", "setTitle": "SU25", "num": 44, "question": "Which of the following is NOT a component of the reinforcement learning framework?", "options": {"A": "Agent", "B": "Environment", "C": "Memory", "D": "Reward Signal"}, "answer": "C", "explanation": "Bộ nhớ riêng (Memory) không phải thành phần bắt buộc của khung RL cơ bản.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_45", "setId": "su25_rl", "setTitle": "SU25", "num": 45, "question": "In what way do rewards contribute to the goal-oriented behavior of an agent?", "options": {"A": "By encouraging trial and error", "B": "By increasing randomness", "C": "By decreasing motivation", "D": "By providing feedback on progress"}, "answer": "D", "explanation": "Phần thưởng phản hồi mức tiến triển hướng tới mục tiêu.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_46", "setId": "su25_rl", "setTitle": "SU25", "num": 46, "question": "In reinforcement learning, what is the Bellman equation used for?", "options": {"A": "Calculating the optimal value function", "B": "Estimating the value of actions", "C": "Updating the policy", "D": "Computing the expected reward"}, "answer": "A", "explanation": "Tính hàm giá trị tối ưu (phương trình Bellman tối ưu).", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "trapLabel": "Twin-Stem Trap", "trapNote": "Bellman stem variant (compare SP26 #20/#25): with these options, pick [A] 'Calculating the optimal value function'."}, {"id": "su25_rl_47", "setId": "su25_rl", "setTitle": "SU25", "num": 47, "question": "Which method involves selecting actions based on their probability distribution determined by their estimated value functions?", "options": {"A": "Epsilon-Greedy", "B": "Upper Confidence Bound (UCB)", "C": "Softmax", "D": "Monte Carlo Tree Search"}, "answer": "C", "explanation": "Softmax chọn hành động theo xác suất suy ra từ giá trị ước lượng.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_48", "setId": "su25_rl", "setTitle": "SU25", "num": 48, "question": "Which exploration strategy selects actions according to a probability distribution that balances the known rewards with the potential for discovering new rewards?", "options": {"A": "Softmax Action Selection", "B": "Epsilon-Greedy", "C": "Upper Confidence Bound (UCB)", "D": "Temporal Difference Learning"}, "answer": "A", "explanation": "Softmax Action Selection gán xác suất trực tiếp theo giá trị ước lượng của từng hành động.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/", "trapLabel": "Overlap Trap", "trapNote": "ε-greedy also defines probabilities, but 'distribution balancing known/new rewards' keys [A] Softmax."}, {"id": "su25_rl_49", "setId": "su25_rl", "setTitle": "SU25", "num": 49, "question": "What is the \"exploration-exploitation trade-off\" in reinforcement learning?", "options": {"A": "The decision between using known information versus gathering new information", "B": "The choice between high reward and low risk", "C": "The balance between reward and punishment", "D": "The selection between multiple reward mechanisms"}, "answer": "A", "explanation": "Đánh đổi giữa dùng thông tin đã biết và thu thập thông tin mới.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "su25_rl_50", "setId": "su25_rl", "setTitle": "SU25", "num": 50, "question": "In reinforcement learning, what is an agent?", "options": {"A": "A human supervisor", "B": "A software program", "C": "An entity that interacts with the environment", "D": "A mathematical equation"}, "answer": "C", "explanation": "Thực thể tương tác với môi trường.", "sourceUrl": "https://quizlet.com/1239317353/rel301m-reinforcement-learning-su25-flash-cards/"}, {"id": "sp26_fe_1", "setId": "sp26_fe", "setTitle": "SP26", "num": 1, "question": "What is the key objective of using a Temporal Difference (TD) learning algorithm? (choose the best answer/core idea of TD learning)", "options": {"A": "To estimate the value of a state based on the complete return from a full episode.", "B": "To update the value function by using the difference between successive state values.", "C": "To learn the optimal value function without requiring a model of the environment's dynamics.", "D": "To approximate the total return by bootstrapping from the immediate reward and the estimated value of the next state."}, "answer": "D", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_2", "setId": "sp26_fe", "setTitle": "SP26", "num": 2, "question": "Which of the following methods is associated with distribution models for handling uncertainty in state transitions?", "options": {"A": "Markov Decision Processes (MDPs)", "B": "Policy Gradient Methods", "C": "Particle Filters", "D": "Q-Learning"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_3", "setId": "sp26_fe", "setTitle": "SP26", "num": 3, "question": "Which of the following is a key benefit of using Dyna Architecture?", "options": {"A": "Reduced computational resources", "B": "Increased data redundancy", "C": "Improved model scalability and adaptability", "D": "Simplified system design"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_4", "setId": "sp26_fe", "setTitle": "SP26", "num": 4, "question": "What is the relationship between sample efficiency and sample-based models?", "options": {"A": "Sample-based models are more sample-efficient than distribution models", "B": "Sample-based models are generally less sample-efficient than distribution models", "C": "Both types of models have the same sample efficiency", "D": "Sample efficiency is not a concern in reinforcement learning"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_5", "setId": "sp26_fe", "setTitle": "SP26", "num": 5, "question": "What does the exploration in Gaussian policies rely on?", "options": {"A": "Random noise added to the mean action", "B": "Random sampling from a uniform distribution", "C": "Fixed exploration rate", "D": "Adaptive exploration based on reward feedback"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_6", "setId": "sp26_fe", "setTitle": "SP26", "num": 6, "question": "Which factor influences the stability of policy gradient algorithms during training?", "options": {"A": "Learning rate", "B": "Discount factor", "C": "Exploration rate", "D": "Entropy regularization"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "alsoIn": "SU26 #16"}, {"id": "sp26_fe_7", "setId": "sp26_fe", "setTitle": "SP26", "num": 7, "question": "Which of the following algorithms is commonly used in reinforcement learning?", "options": {"A": "k-Nearest Neighbors", "B": "Q-Learning", "C": "Principal Component Analysis", "D": "Decision Trees"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_8", "setId": "sp26_fe", "setTitle": "SP26", "num": 8, "question": "What is a potential disadvantage of using Expected Sarsa over Sarsa?", "options": {"A": "It tends to have higher variance in updates", "B": "It requires knowledge of the policy's action probabilities", "C": "It converges more slowly than Sarsa", "D": "It cannot be used in online learning settings"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_9", "setId": "sp26_fe", "setTitle": "SP26", "num": 9, "question": "In the sample average method, what does the step size parameter determine?", "options": {"A": "The total number of actions taken", "B": "The influence of the most recent reward on the estimate", "C": "The number of ads to display", "D": "The initial value of Q"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_10", "setId": "sp26_fe", "setTitle": "SP26", "num": 10, "question": "Which technique is commonly used to reduce the variance of policy gradient estimates?", "options": {"A": "Actor-Critic methods", "B": "Temporal Difference learning", "C": "Monte Carlo Tree Search", "D": "Model-based reinforcement learning"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_11", "setId": "sp26_fe", "setTitle": "SP26", "num": 11, "question": "What is the primary purpose of the state value function in reinforcement learning?", "options": {"A": "To determine the probability of taking a certain action", "B": "To estimate the future rewards from a given state", "C": "To record the history of visited states", "D": "To minimize the error rate of predictions"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_12", "setId": "sp26_fe", "setTitle": "SP26", "num": 12, "question": "What is the main challenge associated with using parameterized policies in reinforcement learning?", "options": {"A": "They are computationally expensive", "B": "They often lead to overfitting", "C": "They require a large amount of training data", "D": "They can suffer from local optima"}, "answer": "D", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_13", "setId": "sp26_fe", "setTitle": "SP26", "num": 13, "question": "What is the advantage of using a higher number of sample points in estimating the gradient?", "options": {"A": "Increased accuracy", "B": "Decreased computation time", "C": "Reduced memory usage", "D": "Smaller margin of error"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_14", "setId": "sp26_fe", "setTitle": "SP26", "num": 14, "question": "Which statement best describes Tabular Temporal Difference (TD) learning?", "options": {"A": "It uses a table to store values for each state-action pair.", "B": "It uses function approximation to estimate value functions.", "C": "It updates values based on rewards and state transitions without using tables.", "D": "It requires the exact model of the environment."}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "trapLabel": "Imprecise Key", "trapNote": "Tabular TD(0) stores state values V(s) while TD control stores Q(s,a); [A] is the only tabular option."}, {"id": "sp26_fe_15", "setId": "sp26_fe", "setTitle": "SP26", "num": 15, "question": "What does the Q-Learning update do in the context of planning?", "options": {"A": "It generates new states.", "B": "It improves the policy based on updated action values.", "C": "It eliminates the need for a model.", "D": "It only focuses on real-world experiences."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_16", "setId": "sp26_fe", "setTitle": "SP26", "num": 16, "question": "In expected Sarsa, the weights used in the expectation calculation are based on:", "options": {"A": "The rewards received", "B": "The probability of taking each action under the agent's policy", "C": "The number of actions available", "D": "The current state of the environment"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_17", "setId": "sp26_fe", "setTitle": "SP26", "num": 17, "question": "Which algorithm is commonly used to solve an MDP?", "options": {"A": "K-means clustering", "B": "Breadth-first search", "C": "Value iteration", "D": "Gradient descent"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_18", "setId": "sp26_fe", "setTitle": "SP26", "num": 18, "question": "What is a common approach to reduce the variance in Monte Carlo estimates?", "options": {"A": "Using a discount factor.", "B": "Using importance sampling.", "C": "Using eligibility traces.", "D": "Using linear function approximation."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "trapLabel": "Domain Clash", "trapNote": "Importance sampling reduces variance in general MC stats ([B]), but inflates variance in off-policy RL (see SU26 #45)."}, {"id": "sp26_fe_19", "setId": "sp26_fe", "setTitle": "SP26", "num": 19, "question": "In contrast to Dynamic Programming and Monte Carlo methods, what aspect makes Temporal Difference (TD) methods more suitable for online learning?", "options": {"A": "TD methods are slower to update values.", "B": "TD methods require extensive computational resources.", "C": "TD methods update values based on incomplete sequences.", "D": "TD methods are less flexible in adapting to changing environments."}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_20", "setId": "sp26_fe", "setTitle": "SP26", "num": 20, "question": "What is the Bellman equation used for in the context of MDPs?", "options": {"A": "To determine the optimal policy.", "B": "To update the value function.", "C": "To calculate the transition probabilities.", "D": "To find the immediate reward."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "trapLabel": "Twin-Stem Trap", "trapNote": "Identical stem to SP26 #25 with different options! When 'To update the value function' appears, pick [B]."}, {"id": "sp26_fe_21", "setId": "sp26_fe", "setTitle": "SP26", "num": 21, "question": "In the context of linear function approximation, what is the gradient of the value function approximation?", "options": {"A": "The true value of the state", "B": "The feature vector in that state", "C": "The mean squared error", "D": "The policy value"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_22", "setId": "sp26_fe", "setTitle": "SP26", "num": 22, "question": "Which phase of Policy Iteration involves updating the policy based on the current value function?", "options": {"A": "Policy Evaluation", "B": "Policy Improvement", "C": "Policy Initialization", "D": "Policy Iteration"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_23", "setId": "sp26_fe", "setTitle": "SP26", "num": 23, "question": "In the context of function approximation, what does Mu of S represent?", "options": {"A": "The total number of states", "B": "The probability distribution of state visits", "C": "The error in value function approximation", "D": "The learning rate of the algorithm"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_24", "setId": "sp26_fe", "setTitle": "SP26", "num": 24, "question": "What does the term \"off-policy\" refer to in the context of Expected Sarsa?", "options": {"A": "Learning from actions that are not taken by the agent.", "B": "Learning from actions that are taken by the agent.", "C": "Learning without any prior knowledge of the environment.", "D": "Learning that does not depend on the current policy."}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_25", "setId": "sp26_fe", "setTitle": "SP26", "num": 25, "question": "What is the Bellman equation used for in the context of MDPs?", "options": {"A": "To calculate the shortest path between states.", "B": "To update the policy in reinforcement learning.", "C": "To express the relationship between the value of a state and the values of its successor states.", "D": "To compute the transition probabilities between states to get maximum rewards."}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "trapLabel": "Twin-Stem Trap", "trapNote": "Identical stem to SP26 #20 with different options! When 'value of a state and successor states' appears, pick [C]."}, {"id": "sp26_fe_27", "setId": "sp26_fe", "setTitle": "SP26", "num": 27, "question": "Which problem arises due to the use of linear function approximation in reinforcement learning?", "options": {"A": "Overfitting", "B": "Curse of dimensionality", "C": "Underfitting", "D": "Vanishing gradients"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_28", "setId": "sp26_fe", "setTitle": "SP26", "num": 28, "question": "In the context of Temporal Difference (TD), Which of the following is NOT a step in the TD(0) algorithm?", "options": {"A": "Prediction", "B": "Evaluation", "C": "Backpropagation", "D": "Bootstrapping"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_30", "setId": "sp26_fe", "setTitle": "SP26", "num": 30, "question": "Which of the following is a key component of Monte Carlo simulations?", "options": {"A": "Deterministic algorithms", "B": "Random sampling", "C": "Fixed input values", "D": "Analytical solutions"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_31", "setId": "sp26_fe", "setTitle": "SP26", "num": 31, "question": "In reinforcement learning, the state value function V(s) represents:", "options": {"A": "The immediate reward received after taking an action in state s", "B": "The total accumulated reward from state s", "C": "The expected return starting from state s", "D": "The likelihood of transitioning from state s to another state"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_32", "setId": "sp26_fe", "setTitle": "SP26", "num": 32, "question": "What is the main purpose of using optimistic initial values in function approximation?", "options": {"A": "To ensure faster convergence", "B": "To encourage exploration", "C": "To minimize errors", "D": "To guarantee optimal solutions"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_33", "setId": "sp26_fe", "setTitle": "SP26", "num": 33, "question": "In the Monte Carlo prediction method, what is the purpose of using the policy π?", "options": {"A": "To determine the sequence of states", "B": "To generate episodes", "C": "To update the value function", "D": "To ensure convergence of the algorithm"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_34", "setId": "sp26_fe", "setTitle": "SP26", "num": 34, "question": "What does the term \"semi-gradient\" refer to in the context of linear semi-gradient Temporal Difference learning?", "options": {"A": "Using gradients to update the table values.", "B": "Approximating gradients using a non-linear function.", "C": "Using part of the gradient information to update parameters.", "D": "Calculating exact gradients for function updates."}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_35", "setId": "sp26_fe", "setTitle": "SP26", "num": 35, "question": "In reinforcement learning, what does a stochastic policy do?", "options": {"A": "Selects actions randomly with equal probability", "B": "Selects the same action for a given state every time", "C": "Selects actions based on a probability distribution", "D": "Does not select any action"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_36", "setId": "sp26_fe", "setTitle": "SP26", "num": 36, "question": "What does the term \"greedification\" refer to in the context of policy improvement?", "options": {"A": "Making a policy more random", "B": "Selecting actions that maximize the value function", "C": "Evaluating the performance of a policy", "D": "Following the original policy without changes"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_37", "setId": "sp26_fe", "setTitle": "SP26", "num": 37, "question": "Which of the following is NOT a typical component of a reinforcement learning model?", "options": {"A": "State transition probabilities", "B": "Reward function", "C": "Policy network", "D": "Action space"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "trapLabel": "Flawed Stem", "trapNote": "Transition probabilities ARE part of an RL model; stem confused 'model' with 'model-free agent' — exam keys [A]."}, {"id": "sp26_fe_38", "setId": "sp26_fe", "setTitle": "SP26", "num": 38, "question": "In an experiment, a pigeon is trained to peck a key when it sees a red light but not when it sees a green light. This is an example of:", "options": {"A": "Generalization", "B": "Spontaneous recovery", "C": "Discrimination", "D": "Habituation"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_39", "setId": "sp26_fe", "setTitle": "SP26", "num": 39, "question": "How many components does the feature vector have when there are four features and three actions in a stacked representation?", "options": {"A": "4", "B": "7", "C": "12", "D": "16"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_40", "setId": "sp26_fe", "setTitle": "SP26", "num": 40, "question": "In policy iteration, what is the role of the policy evaluation step?", "options": {"A": "To improve the policy based on current estimates of the value function", "B": "To randomly update the policy", "C": "To compute the value function of the current policy", "D": "To explore different policies without updating them"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_41", "setId": "sp26_fe", "setTitle": "SP26", "num": 41, "question": "Which of the following exploration strategies is commonly used with SARSA?", "options": {"A": "Softmax action selection", "B": "Upper Confidence Bound (UCB)", "C": "Epsilon-greedy", "D": "Boltzmann exploration"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_42", "setId": "sp26_fe", "setTitle": "SP26", "num": 42, "que
