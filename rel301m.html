        const keyLabel = appState.learnShuffleOpts ? String(idx + 1) : origKey;
        return '<button type="button" data-learn-choice="' + origKey + '" class="learn-opt-btn group w-full text-left px-5 py-4 sm:px-6 sm:py-5 rounded-2xl border-2 border-slate-200/90 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-400 bg-white dark:bg-slate-900 hover:bg-indigo-50/30 dark:hover:bg-indigo-950/20 flex items-center gap-4 transition-all">' +
          '<span class="kbd-key group-hover:border-indigo-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 mt-0.5">' + keyLabel + '</span>' +
          '<span class="text-base sm:text-lg lg:text-[19px] font-medium leading-snug text-slate-800 dark:text-slate-100">' + escapeHtml(card.options[origKey]) + '</span>' +
        '</button>';
      }).join('');

      if (window.lucide) {
        try { window.lucide.createIcons(); } catch (e) {}
      }
    }

    function evaluateLearnChoice(chosenOrigKey, isGiveUp) {
      if (learnState.answeredCurrent || !learnState.queue.length) return;
      learnState.answeredCurrent = true;
      clearAutoAdvance();

      const currentItem = learnState.queue[0];
      const card = STUDY_DATA.cards.find(function (c) { return c.id === currentItem.cardId; });
      const prog = getCardProgress(card.id);
      const isCorrect = !isGiveUp && chosenOrigKey === card.answer;
      const goal = parseInt(appState.masteryGoal, 10) || 2;

      document.getElementById('btnLearnDontKnow').classList.add('hidden');

      document.querySelectorAll('.learn-opt-btn').forEach(function (btn) {
        const k = btn.getAttribute('data-learn-choice');
        btn.disabled = true;
        if (k === card.answer) {
          btn.className = 'learn-opt-btn w-full text-left px-5 py-4 sm:px-6 sm:py-5 rounded-2xl border-2 border-emerald-500 bg-emerald-50/90 dark:bg-emerald-950/50 text-emerald-950 dark:text-emerald-100 flex items-center gap-4';
        } else if (!isGiveUp && k === chosenOrigKey && !isCorrect) {
          btn.className = 'learn-opt-btn w-full text-left px-5 py-4 sm:px-6 sm:py-5 rounded-2xl border-2 border-rose-500 bg-rose-50/90 dark:bg-rose-950/50 text-rose-950 dark:text-rose-100 flex items-center gap-4';
        } else {
          btn.classList.add('opacity-45');
        }
      });

      const fbBox = document.getElementById('learnFeedbackBox');
      const fbTitle = document.getElementById('learnFeedbackTitle');
      const fbDetail = document.getElementById('learnFeedbackDetail');

      if (isCorrect) {
        prog.correctCount += 1;
        if (!currentItem.isRetry) {
          prog.streak = (prog.streak || 0) + 1;
        }
        if (prog.streak >= goal) {
          prog.status = 'mastered';
        } else {
          prog.status = 'learning';
        }

        document.getElementById('learnPromptHint').textContent = 'Correct!';
        document.getElementById('learnMasteryDots').innerHTML = renderMasteryDotsHtml(prog);

        const combinedRightNote = (card.trapNote ? ('⚠ ' + card.trapNote + (card.explanation ? ' · ' : '')) : '') + (card.explanation || '');
        if (appState.learnAutoNext && !combinedRightNote) {
          fbBox.classList.add('hidden');
          autoAdvanceTimer = setTimeout(function () {
            advanceLearnStep();
          }, 620);
        } else if (appState.learnAutoNext && combinedRightNote && !card.trapNote) {
          fbBox.classList.remove('hidden');
          fbBox.className = 'rounded-xl p-3.5 border border-emerald-200 dark:border-emerald-800 bg-emerald-50/80 dark:bg-emerald-950/40 flex items-center justify-between gap-3';
          fbTitle.className = 'font-bold text-xs sm:text-sm text-emerald-800 dark:text-emerald-300';
          fbTitle.textContent = 'Nice!';
          fbDetail.className = 'text-xs sm:text-sm text-emerald-900 dark:text-emerald-200';
          fbDetail.textContent = combinedRightNote;
          autoAdvanceTimer = setTimeout(function () {
            advanceLearnStep();
          }, 1350);
        } else {
          fbBox.classList.remove('hidden');
          fbBox.className = 'rounded-xl p-3.5 border border-emerald-200 dark:border-emerald-800 bg-emerald-50/80 dark:bg-emerald-950/40 flex items-center justify-between gap-3';
          fbTitle.className = 'font-bold text-xs sm:text-sm text-emerald-800 dark:text-emerald-300';
          fbTitle.textContent = card.trapNote ? ('Nice! · ' + card.trapLabel) : 'Nice!';
          fbDetail.className = 'text-xs sm:text-sm text-emerald-900 dark:text-emerald-200';
          fbDetail.textContent = combinedRightNote;
        }
      } else {
        prog.wrongCount += 1;
        prog.streak = 0;
        prog.status = 'learning';
        document.getElementById('learnPromptHint').textContent = isGiveUp ? 'Study this one' : 'Not quite — will repeat this round';
        document.getElementById('learnMasteryDots').innerHTML = renderMasteryDotsHtml(prog);

        fbBox.classList.remove('hidden');
        fbBox.className = 'rounded-xl p-3.5 border border-rose-200 dark:border-rose-800 bg-rose-50/80 dark:bg-rose-950/40 flex items-center justify-between gap-3';
        fbTitle.className = 'font-bold text-xs sm:text-sm text-rose-800 dark:text-rose-300';
        fbTitle.textContent = isGiveUp ? 'Answer' : 'Study this one';
        fbDetail.className = 'text-xs text-rose-900 dark:text-rose-200';
        fbDetail.textContent = (card.trapNote ? ('⚠ ' + card.trapNote + (card.explanation ? ' · ' : '')) : '') + (card.explanation || card.options[card.answer]);
      }

      learnState.lastOutcomeCorrect = isCorrect;
      saveProgress();
      renderDeckOverview();
    }

    function advanceLearnStep() {
      clearAutoAdvance();
      if (!learnState.answeredCurrent || !learnState.queue.length) return;
      const finishedItem = learnState.queue.shift();
      if (learnState.lastOutcomeCorrect) {
        learnState.passedInRound += 1;
      } else {
        learnState.queue.push({ cardId: finishedItem.cardId, isRetry: true });
      }
      learnState.answeredCurrent = false;
      prepareCurrentLearnOptions();
      renderLearnView();
    }

    // ==================== MOCK TEST ENGINE ====================
    let examSession = null;
    let examReviewFilter = 'all';

    function clearExamTimer() {
      if (examSession && examSession.timerId) {
        clearInterval(examSession.timerId);
        examSession.timerId = null;
      }
    }

    function formatTimeSec(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function renderExamHistory() {
      const listEl = document.getElementById('examHistoryList');
      const cntEl = document.getElementById('examHistoryCount');
      const hist = appState.examHistory || [];
      cntEl.textContent = String(hist.length);
      if (hist.length === 0) {
        listEl.innerHTML = '<div class="text-xs text-slate-400 py-6 text-center">Empty</div>';
        return;
      }
      listEl.innerHTML = hist.map(function (h) {
        const badgeCls = h.score10 >= 8
          ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
          : (h.score10 >= 5 ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300' : 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300');
        return '<div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex items-center justify-between gap-2">' +
          '<div class="min-w-0">' +
            '<div class="text-xs font-semibold truncate">' + escapeHtml(h.deckLabel) + '</div>' +
            '<div class="text-[11px] font-mono text-slate-400">' + escapeHtml(h.date) + ' · ' + h.correct + '/' + h.total + '</div>' +
          '</div>' +
          '<span class="px-2 py-0.5 rounded-md font-mono font-bold text-xs shrink-0 ' + badgeCls + '">' + h.score10.toFixed(1) + '</span>' +
        '</div>';
      }).join('');
    }

    function startMockExam() {
      const deckVal = document.getElementById('selExamDeck').value;
      const reqCount = parseInt(document.getElementById('selExamCount').value, 10) || 50;
      const mins = parseInt(document.getElementById('selExamTimer').value, 10) || 0;
      const shufQ = document.getElementById('chkExamShuffleQ').checked;
      const shufOpt = document.getElementById('chkExamShuffleOpt').checked;

      let pool = getCardsByDeck(deckVal);
      const noticeEl = document.getElementById('examSetupNotice');
      if (pool.length === 0) {
        noticeEl.textContent = 'No cards in Familiar / Wrong yet.';
        noticeEl.classList.remove('hidden');
        return;
      }
      noticeEl.classList.add('hidden');

      if (shufQ) pool = shuffleArray(pool);
      const selected = pool.slice(0, Math.min(reqCount, pool.length));
      const deckLabel = document.getElementById('selExamDeck').options[document.getElementById('selExamDeck').selectedIndex].text;

      clearExamTimer();
      examSession = {
        deckLabel: deckLabel,
        items: selected.map(function (c) {
          return {
            card: c,
            optOrder: shufOpt ? shuffleArray(['A', 'B', 'C', 'D']) : ['A', 'B', 'C', 'D'],
            selectedOrigKey: null,
            flagged: false
          };
        }),
        currentIndex: 0,
        limitSec: mins * 60,
        remainingSec: mins * 60,
        elapsedSec: 0,
        timerId: null,
        submitted: false
      };

      document.getElementById('examSetupPanel').classList.add('hidden');
      document.getElementById('examResultPanel').classList.add('hidden');
      document.getElementById('examActivePanel').classList.remove('hidden');

      examSession.timerId = setInterval(function () {
        if (!examSession || examSession.submitted) return;
        examSession.elapsedSec += 1;
        if (examSession.limitSec > 0) {
          examSession.remainingSec -= 1;
          if (examSession.remainingSec <= 0) {
            examSession.remainingSec = 0;
            finishMockExam();
            showToast('Time up!');
            return;
          }
        }
        updateExamTimerUi();
      }, 1000);

      updateExamTimerUi();
      renderActiveExamQuestion();
    }

    function updateExamTimerUi() {
      if (!examSession) return;
      const el = document.getElementById('examTimerDisplay');
      if (examSession.limitSec > 0) {
        el.textContent = formatTimeSec(examSession.remainingSec);
        el.className = examSession.remainingSec <= 120
          ? 'font-mono font-bold text-base text-rose-600 animate-pulse'
          : 'font-mono font-bold text-base text-indigo-600 dark:text-indigo-400';
      } else {
        el.textContent = formatTimeSec(examSession.elapsedSec);
        el.className = 'font-mono font-bold text-base text-indigo-600 dark:text-indigo-400';
      }
    }

    function renderActiveExamQuestion() {
      if (!examSession) return;
      const idx = examSession.currentIndex;
      const total = examSession.items.length;
      const item = examSession.items[idx];

      document.getElementById('examQIndexBadge').textContent = (idx + 1) + ' / ' + total;
      document.getElementById('examQSetBadge').textContent = item.card.setTitle;
      document.getElementById('examQuestionText').textContent = item.card.question;

      const flagBtn = document.getElementById('btnExamFlag');
      const flagLbl = document.getElementById('examFlagLabel');
      if (item.flagged) {
        flagBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold border border-amber-400 bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 flex items-center gap-1';
        flagLbl.textContent = 'Flagged';
      } else {
        flagBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-200 dark:border-slate-700 text-slate-500 flex items-center gap-1';
        flagLbl.textContent = 'Flag';
      }

      document.getElementById('examOptionsList').innerHTML = item.optOrder.map(function (origK, pos) {
        const selected = item.selectedOrigKey === origK;
        const cls = selected
          ? 'border-indigo-600 bg-indigo-50/90 dark:bg-indigo-950/60 text-indigo-950 dark:text-indigo-100'
          : 'border-slate-200 dark:border-slate-800 hover:border-indigo-300 bg-white dark:bg-slate-900';
        const badgeCls = selected
          ? '!bg-indigo-600 !text-white !border-indigo-600'
          : '';
        return '<button type="button" data-exam-opt="' + origK + '" class="w-full text-left px-5 py-4 sm:px-6 sm:py-5 rounded-2xl border-2 flex items-center gap-4 transition-all ' + cls + '">' +
          '<span class="kbd-key ' + badgeCls + '">' + origK + '</span>' +
          '<span class="text-base sm:text-lg font-medium leading-snug">' + escapeHtml(item.card.options[origK]) + '</span>' +
        '</button>';
      }).join('');

      document.getElementById('btnExamPrev').disabled = idx === 0;
      document.getElementById('btnExamNext').disabled = idx === total - 1;

      let answered = 0, flagged = 0;
      examSession.items.forEach(function (it) {
        if (it.selectedOrigKey) answered++;
        if (it.flagged) flagged++;
      });
      document.getElementById('examAnsweredCount').textContent = answered + '/' + total;
      document.getElementById('examFlaggedCount').textContent = String(flagged);

      document.getElementById('examPaletteGrid').innerHTML = examSession.items.map(function (it, i) {
        let cls = 'bg-slate-100 dark:bg-slate-800 text-slate-500 border-transparent';
        if (it.selectedOrigKey) cls = 'bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-200 border-indigo-300 dark:border-indigo-700';
        if (it.flagged) cls = 'bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-400';
        if (i === idx) cls += ' ring-2 ring-indigo-600 dark:ring-indigo-400';
        return '<button type="button" data-exam-jump="' + i + '" class="h-7 rounded-md border font-mono text-xs font-bold ' + cls + '">' + (i + 1) + '</button>';
      }).join('');
    }

    function finishMockExam() {
      if (!examSession || examSession.submitted) return;
      examSession.submitted = true;
      clearExamTimer();

      let correct = 0;
      const wrongCardIds = [];
      examSession.items.forEach(function (it) {
        const prog = getCardProgress(it.card.id);
        if (it.selectedOrigKey === it.card.answer) {
          correct += 1;
          prog.correctCount += 1;
          prog.streak = Math.max(prog.streak || 0, parseInt(appState.masteryGoal, 10) || 2);
          prog.status = 'mastered';
        } else {
          prog.wrongCount += 1;
          prog.streak = 0;
          prog.status = 'learning';
          wrongCardIds.push(it.card.id);
        }
      });

      const total = examSession.items.length || 1;
      const score10 = (correct / total) * 10;
      const now = new Date();
      const dateStr = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0');

      appState.examHistory.unshift({
        date: dateStr,
        deckLabel: examSession.deckLabel,
        correct: correct,
        total: examSession.items.length,
        score10: score10,
        durationSec: examSession.elapsedSec
      });
      appState.examHistory = appState.examHistory.slice(0, 20);
      examSession.wrongCardIds = wrongCardIds;

      saveProgress();
      renderDeckOverview();
      renderExamHistory();

      document.getElementById('examActivePanel').classList.add('hidden');
      document.getElementById('examResultPanel').classList.remove('hidden');

      const pct = Math.round((correct / total) * 100);
      document.getElementById('examResultScoreHeadline').textContent = score10.toFixed(1) + ' / 10 (' + pct + '%)';
      document.getElementById('examResultMeta').textContent = correct + '/' + examSession.items.length + ' · ' + formatTimeSec(examSession.elapsedSec);

      const btnWrong = document.getElementById('btnPracticeWrongExam');
      if (wrongCardIds.length > 0) {
        btnWrong.classList.remove('hidden');
        btnWrong.textContent = 'Learn ' + wrongCardIds.length + ' missed';
      } else {
        btnWrong.classList.add('hidden');
      }

      examReviewFilter = 'all';
      renderExamReviewList();
    }

    function renderExamReviewList() {
      if (!examSession) return;
      document.querySelectorAll('.exam-rev-pill').forEach(function (btn) {
        const f = btn.getAttribute('data-exam-review-filter');
        btn.className = (f === examReviewFilter)
          ? 'exam-rev-pill px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white'
          : 'exam-rev-pill px-3 py-1 rounded-lg text-xs font-semibold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500';
      });

      const filtered = examSession.items.map(function (it, i) {
        return { it: it, num: i + 1 };
      }).filter(function (row) {
        if (examReviewFilter === 'wrong') return row.it.selectedOrigKey !== row.it.card.answer;
        if (examReviewFilter === 'flagged') return row.it.flagged;
        return true;
      });

      const container = document.getElementById('examReviewCardsList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-xs text-slate-400">Empty</div>';
        return;
      }

      container.innerHTML = filtered.map(function (row) {
        const c = row.it.card;
        const chosen = row.it.selectedOrigKey;
        const isRight = chosen === c.answer;
        const statusDot = isRight
          ? '<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>'
          : '<span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>';

        const optsHtml = ['A', 'B', 'C', 'D'].map(function (k) {
          let cls = 'border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300';
          if (k === c.answer) cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-950 dark:text-emerald-100 font-semibold';
          else if (k === chosen && !isRight) cls = 'border-rose-400 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200 line-through';
          return '<div class="px-3 py-1.5 rounded-lg border text-xs sm:text-sm ' + cls + '"><span class="font-mono font-bold mr-1.5">' + k + '</span>' + escapeHtml(c.options[k]) + '</div>';
        }).join('');

        return '<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 space-y-2.5">' +
          '<div class="flex items-center justify-between text-xs text-slate-400">' +
            '<div class="flex items-center gap-2 font-mono">' + statusDot + '<span>#' + row.num + ' · ' + escapeHtml(c.setTitle) + '</span></div>' +
            '<a href="' + escapeHtml(c.sourceUrl) + '" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-500">↗</a>' +
          '</div>' +
          '<p class="font-semibold text-sm">' + escapeHtml(c.question) + '</p>' +
          '<div class="grid grid-cols-1 gap-1.5">' + optsHtml + '</div>' +
          (c.trapNote ? '<div class="text-xs text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/50 border border-amber-200/70 dark:border-amber-800/60 p-2.5 rounded-lg"><strong>⚠ ' + escapeHtml(c.trapLabel) + ':</strong> ' + escapeHtml(c.trapNote) + '</div>' : '') +
          (c.explanation ? '<div class="text-xs text-slate-500 bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-lg">' + escapeHtml(c.explanation) + '</div>' : '') +
        '</div>';
      }).join('');
    }

    // ==================== BROWSE LIST ====================
    let browsePage = 1;
    const BROWSE_PAGE_SIZE = 15;
    let revealedInBrowse = {};

    function renderBrowseView() {
      const q = (document.getElementById('browseSearchInput').value || '').trim().toLowerCase();
      document.getElementById('chkBrowseHideAnswers').checked = !!appState.browseHideAnswers;

      const filtered = getFilteredCards().filter(function (c) {
        if (!q) return true;
        const hay = (c.question + ' ' + c.options.A + ' ' + c.options.B + ' ' + c.options.C + ' ' + c.options.D + ' ' + (c.explanation || '') + ' ' + (c.trapNote || '') + ' ' + (c.trapLabel || '')).toLowerCase();
        return hay.indexOf(q) !== -1;
      });

      document.getElementById('browseResultCount').textContent = String(filtered.length);

      const totalPages = Math.max(1, Math.ceil(filtered.length / BROWSE_PAGE_SIZE));
      if (browsePage > totalPages) browsePage = totalPages;
      if (browsePage < 1) browsePage = 1;

      const slice = filtered.slice((browsePage - 1) * BROWSE_PAGE_SIZE, browsePage * BROWSE_PAGE_SIZE);
      const container = document.getElementById('browseCardsContainer');

      if (slice.length === 0) {
        container.innerHTML = '<div class="p-10 text-center text-xs text-slate-400">No match</div>';
      } else {
        container.innerHTML = slice.map(function (c) {
          const p = getCardProgress(c.id);
          const hideAns = appState.browseHideAnswers && !revealedInBrowse[c.id];
          const stBtnCls = p.status === 'mastered'
            ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
            : (p.status === 'learning'
              ? 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300'
              : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400');
          const stLabel = p.status === 'mastered' ? 'Mastered' : (p.status === 'learning' ? 'Familiar' : 'New');

          const optsGrid = ['A', 'B', 'C', 'D'].map(function (k) {
            const isCorrectOpt = !hideAns && k === c.answer;
            const cls = isCorrectOpt
              ? 'border-emerald-500 bg-emerald-50/90 dark:bg-emerald-950/40 text-emerald-950 dark:text-emerald-100 font-semibold'
              : 'border-slate-200/70 dark:border-slate-800 text-slate-600 dark:text-slate-300';
            return '<div class="px-3 py-1.5 rounded-lg border text-xs sm:text-sm ' + cls + '"><span class="font-mono font-bold mr-1.5 opacity-60">' + k + '</span>' + escapeHtml(c.options[k]) + '</div>';
          }).join('');

          return '<article class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 space-y-2.5 shadow-sm">' +
            '<div class="flex items-center justify-between">' +
              '<div class="flex items-center gap-2"><span class="text-xs font-mono font-semibold text-indigo-600 dark:text-indigo-400">' + escapeHtml(c.setTitle) + ' #' + c.num + (c.alsoIn ? (' · = ' + escapeHtml(c.alsoIn)) : '') + '</span>' + (c.trapLabel ? '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300">⚠ ' + escapeHtml(c.trapLabel) + '</span>' : '') + '</div>' +
              '<div class="flex items-center gap-1.5">' +
                '<button type="button" data-browse-toggle-status="' + c.id + '" class="px-2 py-0.5 rounded text-[11px] font-semibold ' + stBtnCls + '">' + stLabel + '</button>' +
                '<button type="button" data-browse-star="' + c.id + '" class="px-1.5 py-0.5 rounded text-xs ' + (p.starred ? 'text-amber-500' : 'text-slate-300 hover:text-amber-500') + '">★</button>' +
                '<a href="' + escapeHtml(c.sourceUrl) + '" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-indigo-500">↗</a>' +
              '</div>' +
            '</div>' +
            '<h3 class="font-semibold text-sm sm:text-base leading-snug">' + escapeHtml(c.question) + '</h3>' +
            '<div class="grid grid-cols-1 gap-1.5">' + optsGrid + '</div>' +
            (hideAns
              ? '<button type="button" data-browse-reveal="' + c.id + '" class="px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 text-xs font-semibold">Show</button>'
              : (c.trapNote ? '<p class="text-xs text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/50 border border-amber-200/70 dark:border-amber-800/60 p-2.5 rounded-lg"><strong>⚠ ' + escapeHtml(c.trapLabel) + ':</strong> ' + escapeHtml(c.trapNote) + '</p>' : '') +
              (c.explanation ? '<p class="text-xs text-slate-500 bg-slate-50 dark:bg-slate-800/60 p-2 rounded-lg">' + escapeHtml(c.explanation) + '</p>' : '')) +
          '</article>';
        }).join('');
      }

      document.getElementById('browsePageIndicator').textContent = browsePage + ' / ' + totalPages;
      document.getElementById('btnBrowsePrevPage').disabled = browsePage <= 1;
      document.getElementById('btnBrowseNextPage').disabled = browsePage >= totalPages;
    }

    // ==================== MODE SWITCHING ====================
    function switchMode(mode) {
      clearAutoAdvance();
      appState.activeMode = mode;
      saveProgress();

      document.querySelectorAll('.mode-tab-btn').forEach(function (btn) {
        const m = btn.getAttribute('data-mode-tab');
        if (m === mode) {
          btn.classList.add('bg-white', 'dark:bg-slate-900', 'text-indigo-600', 'dark:text-indigo-400', 'shadow-sm');
          btn.classList.remove('text-slate-600', 'dark:text-slate-400');
        } else {
          btn.classList.remove('bg-white', 'dark:bg-slate-900', 'text-indigo-600', 'dark:text-indigo-400', 'shadow-sm');
          btn.classList.add('text-slate-600', 'dark:text-slate-400');
        }
      });

      const views = {
        learn: document.getElementById('viewLearn'),
        exam: document.getElementById('viewExam'),
        browse: document.getElementById('viewBrowse')
      };
      Object.keys(views).forEach(function (k) {
        if (k === mode) views[k].classList.remove('hidden');
        else views[k].classList.add('hidden');
      });

      const overviewBar = document.getElementById('deckOverviewBar');
      if (mode === 'exam') overviewBar.classList.add('hidden');
      else overviewBar.classList.remove('hidden');

      if (mode === 'learn') {
        if (!learnState.queue.length && learnState.roundTotal === 0) startNewLearnRound(false);
        else renderLearnView();
      } else if (mode === 'exam') {
        renderExamHistory();
      } else if (mode === 'browse') {
        renderBrowseView();
      }

      if (window.lucide) {
        try { window.lucide.createIcons(); } catch (e) {}
      }
    }

    let pendingConfirmCallback = null;
    function openConfirmModal(title, message, okLabel, onConfirm) {
      document.getElementById('modalConfirmTitle').textContent = title;
      document.getElementById('modalConfirmMessage').textContent = message;
      document.getElementById('btnModalConfirmOk').textContent = okLabel || 'Confirm';
      pendingConfirmCallback = onConfirm;
      document.getElementById('modalConfirm').classList.remove('hidden');
    }

    function closeConfirmModal() {
      pendingConfirmCallback = null;
      document.getElementById('modalConfirm').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', function () {
      applyTheme();
      renderDeckOverview();

      document.querySelectorAll('.mode-tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          switchMode(btn.getAttribute('data-mode-tab'));
        });
      });

      document.getElementById('btnToggleTheme').addEventListener('click', function () {
        appState.darkMode = !appState.darkMode;
        applyTheme();
        saveProgress();
      });

      // Options modal
      document.getElementById('btnOpenOptionsModal').addEventListener('click', function () {
        document.getElementById('chkLearnAutoNext').checked = !!appState.learnAutoNext;
        document.getElementById('chkLearnShuffleOpts').checked = !!appState.learnShuffleOpts;
        document.getElementById('selMasteryGoal').value = String(appState.masteryGoal || 2);
        document.getElementById('selRoundSize').value = String(appState.roundSize || 7);
        document.getElementById('modalOptions').classList.remove('hidden');
      });

      document.getElementById('btnCloseOptionsModal').addEventListener('click', function () {
        document.getElementById('modalOptions').classList.add('hidden');
      });

      document.getElementById('chkLearnAutoNext').addEventListener('change', function (e) {
        appState.learnAutoNext = e.target.checked;
        saveProgress();
      });

      document.getElementById('chkLearnShuffleOpts').addEventListener('change', function (e) {
        appState.learnShuffleOpts = e.target.checked;
        saveProgress();
        if (!learnState.answeredCurrent) {
          prepareCurrentLearnOptions();
          renderLearnView();
        }
      });

      document.getElementById('selMasteryGoal').addEventListener('change', function (e) {
        appState.masteryGoal = parseInt(e.target.value, 10) || 2;
        saveProgress();
        renderLearnView();
      });

      document.getElementById('selRoundSize').addEventListener('change', function (e) {
        appState.roundSize = parseInt(e.target.value, 10) || 7;
        saveProgress();
        startNewLearnRound(false);
      });

      // Deck & Filter selection
      document.getElementById('deckPillsContainer').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-deck-select]');
        if (!btn) return;
        appState.activeDeck = btn.getAttribute('data-deck-select');
        appState.roundNumber = 1;
        browsePage = 1;
        saveProgress();
        renderDeckOverview();
        if (appState.activeMode === 'learn') startNewLearnRound(false);
        else if (appState.activeMode === 'browse') renderBrowseView();
      });

      document.getElementById('statusFilterPills').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-status-filter]');
        if (!btn) return;
        appState.statusFilter = btn.getAttribute('data-status-filter');
        browsePage = 1;
        saveProgress();
        renderDeckOverview();
        if (appState.activeMode === 'learn') startNewLearnRound(false);
        else if (appState.activeMode === 'browse') renderBrowseView();
      });

      document.getElementById('btnResetLearnFilter').addEventListener('click', function () {
        appState.statusFilter = 'all';
        saveProgress();
        renderDeckOverview();
        startNewLearnRound(false);
      });

      // Learn interactions
      document.getElementById('learnOptionsContainer').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-learn-choice]');
        if (!btn) return;
        evaluateLearnChoice(btn.getAttribute('data-learn-choice'), false);
      });

      document.getElementById('btnLearnDontKnow').addEventListener('click', function () {
        evaluateLearnChoice(null, true);
      });

      document.getElementById('btnLearnContinue').addEventListener('click', advanceLearnStep);
      document.getElementById('btnLearnNewRound').addEventListener('click', function () {
        startNewLearnRound(false);
        showToast('New round');
      });
      document.getElementById('btnLearnNextBatch').addEventListener('click', function () {
        startNewLearnRound(true);
      });
      document.getElementById('btnLearnSwitchExam').addEventListener('click', function () {
        switchMode('exam');
      });

      document.getElementById('btnLearnStar').addEventListener('click', function () {
        if (!learnState.queue.length) return;
        const prog = getCardProgress(learnState.queue[0].cardId);
        prog.starred = !prog.starred;
        saveProgress();
        renderDeckOverview();
        renderLearnView();
      });

      document.getElementById('btnLearnSpeak').addEventListener('click', function () {
        if (!learnState.queue.length) return;
        const card = STUDY_DATA.cards.find(function (c) { return c.id === learnState.queue[0].cardId; });
        if (!card) return;
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(card.question);
            u.lang = 'en-US';
            u.rate = 0.98;
            window.speechSynthesis.speak(u);
          }
        } catch (err) {}
      });

      // Exam interactions
      document.getElementById('btnStartExam').addEventListener('click', startMockExam);

      document.getElementById('examOptionsList').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-exam-opt]');
        if (!btn || !examSession) return;
        examSession.items[examSession.currentIndex].selectedOrigKey = btn.getAttribute('data-exam-opt');
        renderActiveExamQuestion();
      });

      document.getElementById('examPaletteGrid').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-exam-jump]');
        if (!btn || !examSession) return;
        examSession.currentIndex = parseInt(btn.getAttribute('data-exam-jump'), 10);
        renderActiveExamQuestion();
      });

      document.getElementById('btnExamFlag').addEventListener('click', function () {
        if (!examSession) return;
        const item = examSession.items[examSession.currentIndex];
        item.flagged = !item.flagged;
        renderActiveExamQuestion();
      });

      document.getElementById('btnExamPrev').addEventListener('click', function () {
        if (!examSession || examSession.currentIndex <= 0) return;
        examSession.currentIndex -= 1;
        renderActiveExamQuestion();
      });

      document.getElementById('btnExamNext').addEventListener('click', function () {
        if (!examSession || examSession.currentIndex >= examSession.items.length - 1) return;
        examSession.currentIndex += 1;
        renderActiveExamQuestion();
      });

      document.getElementById('btnSubmitExamRequest').addEventListener('click', function () {
        if (!examSession) return;
        const unanswered = examSession.items.filter(function (it) { return !it.selectedOrigKey; }).length;
        if (unanswered > 0) {
          openConfirmModal('Submit test?', unanswered + ' unanswered questions.', 'Submit', finishMockExam);
        } else {
          finishMockExam();
        }
      });

      document.getElementById('btnCancelExam').addEventListener('click', function () {
        openConfirmModal('Quit test?', 'Current attempt will be discarded.', 'Quit', function () {
          clearExamTimer();
          examSession = null;
          document.getElementById('examActivePanel').classList.add('hidden');
          document.getElementById('examSetupPanel').classList.remove('hidden');
        });
      });

      document.getElementById('btnNewExamSetup').addEventListener('click', function () {
        clearExamTimer();
        examSession = null;
        document.getElementById('examResultPanel').classList.add('hidden');
        document.getElementById('examSetupPanel').classList.remove('hidden');
      });

      document.getElementById('btnPracticeWrongExam').addEventListener('click', function () {
        if (!examSession || !examSession.wrongCardIds || !examSession.wrongCardIds.length) return;
        const subset = examSession.wrongCardIds.slice(0, parseInt(appState.roundSize, 10) || 7);
        learnState.roundCardIds = subset.slice();
        learnState.queue = subset.map(function (id) {
          return { cardId: id, isRetry: false };
        });
        learnState.passedInRound = 0;
        learnState.roundTotal = learnState.queue.length;
        learnState.answeredCurrent = false;
        prepareCurrentLearnOptions();
        switchMode('learn');
        renderLearnView();
      });

      document.querySelectorAll('.exam-rev-pill').forEach(function (btn) {
        btn.addEventListener('click', function () {
          examReviewFilter = btn.getAttribute('data-exam-review-filter');
          renderExamReviewList();
        });
      });

      // Browse interactions
      document.getElementById('browseSearchInput').addEventListener('input', function () {
        browsePage = 1;
        renderBrowseView();
      });

      document.getElementById('chkBrowseHideAnswers').addEventListener('change', function (e) {
        appState.browseHideAnswers = e.target.checked;
        revealedInBrowse = {};
        saveProgress();
        renderBrowseView();
      });

      document.getElementById('browseCardsContainer').addEventListener('click', function (e) {
        const revBtn = e.target.closest('[data-browse-reveal]');
        if (revBtn) {
          revealedInBrowse[revBtn.getAttribute('data-browse-reveal')] = true;
          renderBrowseView();
          return;
        }
        const starBtn = e.target.closest('[data-browse-star]');
        if (starBtn) {
          const id = starBtn.getAttribute('data-browse-star');
          const p = getCardProgress(id);
          p.starred = !p.starred;
          saveProgress();
          renderDeckOverview();
          renderBrowseView();
          return;
        }
        const stBtn = e.target.closest('[data-browse-toggle-status]');
        if (stBtn) {
          const id = stBtn.getAttribute('data-browse-toggle-status');
          const p = getCardProgress(id);
          const nextMap = { unseen: 'learning', learning: 'mastered', mastered: 'unseen' };
          p.status = nextMap[p.status] || 'unseen';
          p.streak = p.status === 'mastered' ? 2 : (p.status === 'learning' ? 1 : 0);
          saveProgress();
          renderDeckOverview();
          renderBrowseView();
        }
      });

      document.getElementById('btnBrowsePrevPage').addEventListener('click', function () {
        if (browsePage > 1) {
          browsePage -= 1;
          renderBrowseView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('btnBrowseNextPage').addEventListener('click', function () {
        browsePage += 1;
        renderBrowseView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Backup & Reset Modals
      document.getElementById('btnOpenBackupModal').addEventListener('click', function () {
        document.getElementById('txtBackupJson').value = JSON.stringify(appState, null, 2);
        document.getElementById('modalBackup').classList.remove('hidden');
      });

      document.getElementById('btnCloseBackupModal').addEventListener('click', function () {
        document.getElementById('modalBackup').classList.add('hidden');
      });

      document.getElementById('btnCopyBackupJson').addEventListener('click', function () {
        const txt = document.getElementById('txtBackupJson');
        txt.select();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt.value).then(function () {
              showToast('Copied');
            }).catch(function () {
              document.execCommand('copy');
              showToast('Copied');
            });
          } else {
            document.execCommand('copy');
            showToast('Copied');
          }
        } catch (err) {
          showToast('Ctrl+C');
        }
      });

      document.getElementById('btnDownloadBackupJson').addEventListener('click', function () {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'rel301m_progress.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded');
      });

      document.getElementById('btnRestoreBackupJson').addEventListener('click', function () {
        try {
          const parsed = JSON.parse(document.getElementById('txtBackupJson').value);
          if (!parsed || typeof parsed !== 'object') throw new Error('Invalid');
          appState = Object.assign(createDefaultProgress(), parsed);
          if (appState.activeMode === 'flashcards') appState.activeMode = 'learn';
          saveProgress();
          applyTheme();
          renderDeckOverview();
          startNewLearnRound(false);
          switchMode(appState.activeMode || 'learn');
          document.getElementById('modalBackup').classList.add('hidden');
          showToast('Restored');
        } catch (err) {
          showToast('Invalid JSON');
        }
      });

      document.getElementById('btnOpenResetModal').addEventListener('click', function () {
        openConfirmModal('Reset progress?', 'Clear mastery progress for current deck.', 'Reset', function () {
          const targetCards = getCardsByDeck(appState.activeDeck);
          targetCards.forEach(function (c) {
            delete appState.cards[c.id];
          });
          appState.roundNumber = 1;
          saveProgress();
          renderDeckOverview();
          if (appState.activeMode === 'learn') startNewLearnRound(false);
          else if (appState.activeMode === 'browse') renderBrowseView();
          showToast('Reset');
        });
      });

      document.getElementById('btnModalConfirmCancel').addEventListener('click', closeConfirmModal);
      document.getElementById('btnModalConfirmOk').addEventListener('click', function () {
        const fn = pendingConfirmCallback;
        closeConfirmModal();
        if (typeof fn === 'function') fn();
      });

      // Keyboard shortcuts (1-4 to pick, Enter/Space to continue, 0 for Don't know, S to star)
      window.addEventListener('keydown', function (e) {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (!document.getElementById('modalConfirm').classList.contains('hidden')) return;
        if (!document.getElementById('modalBackup').classList.contains('hidden')) return;
        if (!document.getElementById('modalOptions').classList.contains('hidden')) return;

        if (appState.activeMode === 'learn') {
          if (learnState.queue.length === 0 && (e.key === 'Enter' || e.code === 'Space')) {
            e.preventDefault();
            startNewLearnRound(true);
            return;
          }
          if (learnState.answeredCurrent && (e.key === 'Enter' || e.code === 'Space')) {
            e.preventDefault();
            advanceLearnStep();
            return;
          }
          if (!learnState.answeredCurrent && learnState.queue.length > 0) {
            const idxMap = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
            const k = e.key.toLowerCase();
            if (Object.prototype.hasOwnProperty.call(idxMap, k)) {
              e.preventDefault();
              const chosenOrig = learnState.currentOptionOrder[idxMap[k]];
              if (chosenOrig) evaluateLearnChoice(chosenOrig, false);
            } else if (e.key === '0') {
              e.preventDefault();
              evaluateLearnChoice(null, true);
            } else if (k === 's') {
              e.preventDefault();
              document.getElementById('btnLearnStar').click();
            }
          }
        }
      });

      startNewLearnRound(false);
      switchMode('learn');
    });
  </script>
</body>
</html>
