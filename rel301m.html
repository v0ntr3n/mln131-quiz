stion": "What advantage does Tile Coding provide compared to a single large lookup table?", "options": {"A": "Increased computational speed", "B": "Reduced overfitting", "C": "More memory efficiency", "D": "Higher resolution of state representation"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_43", "setId": "sp26_fe", "setTitle": "SP26", "num": 43, "question": "Which type of reinforcement learning model typically uses Monte Carlo simulations to estimate values?", "options": {"A": "Sample-based models", "B": "Distribution models", "C": "Both sample-based and distribution models", "D": "Neither sample-based nor distribution models"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_44", "setId": "sp26_fe", "setTitle": "SP26", "num": 44, "question": "In Policy Iteration, which step involves evaluating the current policy's performance and updating the value function?", "options": {"A": "Policy Evaluation", "B": "Policy Improvement", "C": "Policy Initialization", "D": "Policy Iteration"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_45", "setId": "sp26_fe", "setTitle": "SP26", "num": 45, "question": "Which of the following is a primary characteristic of a distribution model in reinforcement learning?", "options": {"A": "It directly samples actions based on a policy.", "B": "It approximates the transition dynamics of the environment.", "C": "It only updates after the entire episode ends.", "D": "It requires a deterministic policy."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_46", "setId": "sp26_fe", "setTitle": "SP26", "num": 46, "question": "Which term describes a methodical approach to handling episodic tasks?", "options": {"A": "Ad hoc management", "B": "Reactive management", "C": "Proactive management", "D": "Time-blocking"}, "answer": "D", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/", "trapLabel": "Off-Topic Leak", "trapNote": "Generator confused episodic MDPs with productivity — pick [D] Time-blocking."}, {"id": "sp26_fe_47", "setId": "sp26_fe", "setTitle": "SP26", "num": 47, "question": "Which term describes the probability distribution over next states given a current state and action in an MDP?", "options": {"A": "Policy", "B": "Reward function", "C": "Transition model", "D": "Value function"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_48", "setId": "sp26_fe", "setTitle": "SP26", "num": 48, "question": "What is the purpose of the accumulated product of important sampling ratios (W) in the off-policy Monte Carlo prediction algorithm?", "options": {"A": "To store all past values of Rho", "B": "To correct the returns generated by the behavior policy", "C": "To calculate the average reward", "D": "To simplify the algorithm"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_49", "setId": "sp26_fe", "setTitle": "SP26", "num": 49, "question": "What is the advantage of using policy gradient methods over value-based methods like Q-learning?", "options": {"A": "Better convergence guarantees", "B": "Simpler implementation", "C": "More efficient memory usage", "D": "Ability to handle continuous action spaces"}, "answer": "D", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "sp26_fe_50", "setId": "sp26_fe", "setTitle": "SP26", "num": 50, "question": "What differentiates off-policy Q-learning from on-policy methods like SARSA?", "options": {"A": "Q-learning uses past experiences while SARSA uses future predictions.", "B": "Q-learning updates using the highest Q-value of the next state, while SARSA updates using the action actually taken.", "C": "Q-learning requires a model of the environment, while SARSA does not.", "D": "Q-learning is based on deterministic policies, while SARSA is based on stochastic policies."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867780/rel301m_sp26_fe_683174-flash-cards/"}, {"id": "su26_fe_1", "setId": "su26_fe", "setTitle": "SU26", "num": 1, "question": "In Q-learning, which term is used to update the Q-value for state s and action a?", "options": {"A": "α (learning rate)", "B": "β (exploration rate)", "C": "δ (error term)", "D": "λ (decay rate)"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Two Symbols", "trapNote": "Q(s,a) ← Q(s,a) + α·δ uses both α [A] and TD error δ [C] — memorize [A] α (learning rate) for SU26."}, {"id": "su26_fe_2", "setId": "su26_fe", "setTitle": "SU26", "num": 2, "question": "Why does this TD update allow faster propagation of value information across states?", "options": {"A": "Because it waits until the full return is observed.", "B": "Because it uses estimated future values during each update.", "C": "Because it eliminates the need for rewards in the update rule.", "D": "Because it requires complete knowledge of all transitions in the environment."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Missing Video", "trapNote": "Truncated Coursera stem ('this TD update'): bootstrapping from estimated future values is [B]."}, {"id": "su26_fe_3", "setId": "su26_fe", "setTitle": "SU26", "num": 3, "question": "Which parameter determines the degree of exploration in Actor-Critic with Softmax Policies?", "options": {"A": "Learning rate", "B": "Temperature parameter", "C": "Discount factor", "D": "Advantage function"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_4", "setId": "su26_fe", "setTitle": "SU26", "num": 4, "question": "During the first episode, how does the robot update its action values?", "options": {"A": "Using simulated experience", "B": "By exploring all possible actions", "C": "Through direct RL updates from real experience", "D": "By following a fixed policy"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Missing Video", "trapNote": "Refers to Dyna-Q maze robot: in Episode 1 before model finds goal, updates come from [C] direct RL."}, {"id": "su26_fe_5", "setId": "su26_fe", "setTitle": "SU26", "num": 5, "question": "Which dynamic programming method iteratively improves both the policy and the value function?", "options": {"A": "Policy iteration", "B": "Value iteration", "C": "Monte Carlo methods", "D": "Q-learning"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_6", "setId": "su26_fe", "setTitle": "SU26", "num": 6, "question": "In Monte Carlo prediction, what is typically used to estimate the value of a state?", "options": {"A": "The maximum reward observed during operation", "B": "The average return observed from that state", "C": "The sum of immediate rewards", "D": "The minimum reward observed"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_7", "setId": "su26_fe", "setTitle": "SU26", "num": 7, "question": "What does the Dyna architecture primarily combine?", "options": {"A": "Direct RL updates and planning updates", "B": "Supervised learning and unsupervised learning", "C": "Neural networks and decision trees", "D": "Clustering and regression"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_8", "setId": "su26_fe", "setTitle": "SU26", "num": 8, "question": "What is the primary objective of policy control in reinforcement learning?", "options": {"A": "Maximizing immediate rewards", "B": "Minimizing state-action space", "C": "Balancing exploration and exploitation", "D": "Optimizing computational resources"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_9", "setId": "su26_fe", "setTitle": "SU26", "num": 9, "question": "When a child learns to use a specific greeting for different individuals (e.g., 'Hi' for peers, 'Good morning' for teachers), this is an example of:", "options": {"A": "Generalization", "B": "Discrimination", "C": "Extinction", "D": "Classical conditioning"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_10", "setId": "su26_fe", "setTitle": "SU26", "num": 10, "question": "Which of the following best describes the role of the two arrays (V and V prime) in the iterative policy evaluation algorithm?", "options": {"A": "They store the rewards for each state", "B": "They hold the current and updated values to avoid overwriting during updates", "C": "They represent the actions taken in each state", "D": "They are used to track the exploration strategy"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_11", "setId": "su26_fe", "setTitle": "SU26", "num": 11, "question": "How is the variance parameter typically represented in a Gaussian policy?", "options": {"A": "Scalar value", "B": "Vector", "C": "Matrix", "D": "Tensor"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_12", "setId": "su26_fe", "setTitle": "SU26", "num": 12, "question": "Which of the following statements is true about Q-learning?", "options": {"A": "It is a sample-based version of policy iteration.", "B": "It uses the Bellman equation for action values.", "C": "It can converge to the optimal value function with sufficient exploration.", "D": "It requires prior knowledge of the environment's dynamics."}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Multi-True", "trapNote": "[B] (Bellman action-value) also relates, but [C] (optimal convergence with exploration) is the keyed theorem."}, {"id": "su26_fe_13", "setId": "su26_fe", "setTitle": "SU26", "num": 13, "question": "What is the target policy in off policy learning?", "options": {"A": "The policy used to select actions", "B": "The policy that the agent is learning about", "C": "The policy that generates data", "D": "The policy that evaluates the value function"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_14", "setId": "su26_fe", "setTitle": "SU26", "num": 14, "question": "Which of the following is a potential disadvantage of Random Tabular Q-planning?", "options": {"A": "It requires a model of the environment.", "B": "It may converge slower due to random updates.", "C": "It is not applicable to large state spaces.", "D": "It cannot handle stochastic environments."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_15", "setId": "su26_fe", "setTitle": "SU26", "num": 15, "question": "What is discrimination in the context of learning and behavior?", "options": {"A": "The process by which a response spreads from one specific stimulus to other stimuli that resemble the original.", "B": "The ability to respond differently to similar but distinct stimuli.", "C": "The reinforcement of a behavior in order to increase its frequency.", "D": "The gradual weakening and disappearance of a conditioned response."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_17", "setId": "su26_fe", "setTitle": "SU26", "num": 17, "question": "What is the primary difference between Dyna-Q and Q-learning?", "options": {"A": "Dyna-Q uses a model of the environment", "B": "Q-learning updates Q-values online", "C": "Q-learning is model-free, while Dyna-Q is model-based", "D": "Dyna-Q is less prone to overestimation bias"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Duplicate Truth", "trapNote": "[A] and [C] state the exact same fact! Memorize that SU26 keys [A] 'Dyna-Q uses a model'."}, {"id": "su26_fe_18", "setId": "su26_fe", "setTitle": "SU26", "num": 18, "question": "The concept of Dyna Architecture is closely associated with which field?", "options": {"A": "Artificial Intelligence", "B": "Cybersecurity", "C": "Software Engineering", "D": "Network Management"}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_19", "setId": "su26_fe", "setTitle": "SU26", "num": 19, "question": "Which type of task is more likely to involve checkpoints or milestones?", "options": {"A": "Episodic tasks.", "B": "Continuing tasks.", "C": "Both episodic and continuing tasks.", "D": "Neither episodic nor continuing tasks."}, "answer": "A", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_20", "setId": "su26_fe", "setTitle": "SU26", "num": 20, "question": "Which algorithm is commonly used to estimate action values in model-free reinforcement learning?", "options": {"A": "Monte Carlo Methods", "B": "Value Iteration", "C": "Q-Learning", "D": "Policy Gradient Methods"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_21", "setId": "su26_fe", "setTitle": "SU26", "num": 21, "question": "What is the task of policy evaluation?", "options": {"A": "To find a new policy that maximizes rewards", "B": "To determine the state value function for a specific policy", "C": "To compute the dynamics of the environment", "D": "To reduce the problem of finding v pi to a system of linear equations"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_22", "setId": "su26_fe", "setTitle": "SU26", "num": 22, "question": "When using function approximation with optimistic initial values, which type of function approximation method can be used?", "options": {"A": "Linear function approximation", "B": "Neural networks", "C": "Decision trees", "D": "All of the above"}, "answer": "D", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_23", "setId": "su26_fe", "setTitle": "SU26", "num": 23, "question": "Which of the following statements is true regarding the optimal value function (v star)?", "options": {"A": "It is always negative.", "B": "It can be used to derive the optimal policy.", "C": "It is independent of the dynamics function p.", "D": "It only applies to deterministic environments."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_24", "setId": "su26_fe", "setTitle": "SU26", "num": 24, "question": "What does the Q-learning update with function approximation replace in expected Sarsa?", "options": {"A": "The action value with a random value", "B": "The expectation with the maximum action value", "C": "The weight vector with a fixed value", "D": "The target policy with a uniform policy"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_25", "setId": "su26_fe", "setTitle": "SU26", "num": 25, "question": "How does the Epsilon-greedy strategy decide whether to explore or exploit?", "options": {"A": "It uses a random number generator to choose between exploring or exploiting", "B": "It always explores for the first half of the time and exploits for the second half", "C": "It explores if a randomly generated number is less than epsilon", "D": "It exploits if a randomly generated number is less than epsilon"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_26", "setId": "su26_fe", "setTitle": "SU26", "num": 26, "question": "What is the primary goal when maintaining a website with millions of hits a day in the context of the k-armed bandit problem?", "options": {"A": "To increase the number of ads displayed", "B": "To display the ad that generates the most money", "C": "To reduce the loading time of the website", "D": "To track user behavior"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_27", "setId": "su26_fe", "setTitle": "SU26", "num": 27, "question": "In Off-policy Learning, why must the behavior policy b cover the target policy π?", "options": {"A": "To ensure equal probability for all actions in each state.", "B": "To guarantee that actions used by n can also be sampled by b.", "C": "To force the behavior policy to match the target policy exactly.", "D": "To ensure that each state is visited only once during training."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "OCR Typo", "trapNote": "Typo 'actions used by n' in [B] means target policy π (π(a|s)>0 ⇒ b(a|s)>0) — pick [B]."}, {"id": "su26_fe_28", "setId": "su26_fe", "setTitle": "SU26", "num": 28, "question": "Which of the following statements is true about dynamic programming in reinforcement learning?", "options": {"A": "It is only applicable to problems with discrete action spaces", "B": "It always guarantees convergence to the globally optimal policy", "C": "It is computationally efficient for problems with continuous state spaces", "D": "It is primarily used for deep reinforcement learning tasks"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Overstated", "trapNote": "DP guarantees global optimum only for finite known MDPs, but A/C/D are false — pick [B]."}, {"id": "su26_fe_29", "setId": "su26_fe", "setTitle": "SU26", "num": 29, "question": "Why is it difficult to ensure accurate navigation for star exploration missions?", "options": {"A": "Stars are invisible from Earth.", "B": "There is no way to measure distances accurately in space.", "C": "The vast distances cause significant deviations from intended paths.", "D": "Spacecraft cannot carry enough fuel."}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Off-Topic Leak", "trapNote": "Space-exploration keyword leak — pick [C] Vast distances cause deviations."}, {"id": "su26_fe_30", "setId": "su26_fe", "setTitle": "SU26", "num": 30, "question": "In reinforcement learning, what is a common downside of pure exploitation without exploration?", "options": {"A": "Increased computational complexity.", "B": "Missing out on potentially better actions that haven't been tried enough.", "C": "High variance in reward estimation.", "D": "Difficulty in policy convergence to get maximum the total rewards"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_31", "setId": "su26_fe", "setTitle": "SU26", "num": 31, "question": "What is the main shape used in tile coding to partition the state space?", "options": {"A": "Circles", "B": "Triangles", "C": "Squares", "D": "Hexagons"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "2D Case", "trapNote": "General tile coding uses hyperrectangles; exam keys [C] Squares from 2D textbook examples."}, {"id": "su26_fe_32", "setId": "su26_fe", "setTitle": "SU26", "num": 32, "question": "In the context of Deep Q-Learning, what purpose does the target network serve?", "options": {"A": "It helps in selecting actions based on the policy", "B": "It stabilizes training by providing consistent target values", "C": "It generates synthetic experiences for training", "D": "It models the transition probabilities between states"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_33", "setId": "su26_fe", "setTitle": "SU26", "num": 33, "question": "What does the curse of dimensionality refer to in reinforcement learning?", "options": {"A": "The increase in the number of actions available", "B": "The exponential growth of the state space as the number of state variables increases", "C": "The difficulty of finding an optimal policy", "D": "The limitation of using Monte Carlo methods"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_34", "setId": "su26_fe", "setTitle": "SU26", "num": 34, "question": "Why is it problematic to predict the outcomes of star exploration missions?", "options": {"A": "There is too much public interest.", "B": "The lack of advanced computer models.", "C": "Uncertainties and unknown variables in space.", "D": "Predicting outcomes is unnecessary."}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/", "trapLabel": "Off-Topic Leak", "trapNote": "Space-exploration keyword leak — pick [C] Uncertainties and unknown variables in space."}, {"id": "su26_fe_35", "setId": "su26_fe", "setTitle": "SU26", "num": 35, "question": "In Iterative Policy Evaluation, what does the value function represent?", "options": {"A": "The probability of selecting an action in a given state", "B": "The expected cumulative reward starting from a given state and following a specific policy", "C": "The policy's exploration rate", "D": "The action-value function"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_36", "setId": "su26_fe", "setTitle": "SU26", "num": 36, "question": "What is the primary focus of sample-based models in reinforcement learning?", "options": {"A": "Modeling the environment's entire distribution", "B": "Learning from direct interactions with the environment", "C": "Using theoretical distributions for decision-making", "D": "Predicting future states without actual sampling"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_37", "setId": "su26_fe", "setTitle": "SU26", "num": 37, "question": "Why is the discount factor (γ) important in reinforcement learning algorithms like Episodic Sarsa?", "options": {"A": "It controls the agent's learning rate", "B": "It balances immediate and future rewards", "C": "It dictates the exploration strategy", "D": "It scales the state transition probabilities"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_38", "setId": "su26_fe", "setTitle": "SU26", "num": 38, "question": "What is the common parameterized function used in reinforcement learning to approximate value functions?", "options": {"A": "Linear regression", "B": "Polynomial regression", "C": "Neural networks", "D": "Decision trees"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_39", "setId": "su26_fe", "setTitle": "SU26", "num": 39, "question": "Why is it important to specify an objective in policy evaluation under function approximation?", "options": {"A": "To ensure the algorithm runs faster", "B": "To adapt weights for minimizing value error", "C": "To increase the complexity of the model", "D": "To avoid overfitting"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_41", "setId": "su26_fe", "setTitle": "SU26", "num": 41, "question": "What is the primary objective in the k-armed bandit problem?", "options": {"A": "To minimize the number of arms used.", "B": "To maximize the cumulative reward over time.", "C": "To balance the use of all arms equally.", "D": "To minimize the variance of rewards."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_42", "setId": "su26_fe", "setTitle": "SU26", "num": 42, "question": "What is a significant drawback of distribution models in reinforcement learning?", "options": {"A": "They cannot handle large state spaces", "B": "They require extensive prior knowledge of the environment", "C": "They are not scalable to real-world applications", "D": "They converge slower than sample-based models"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_43", "setId": "su26_fe", "setTitle": "SU26", "num": 43, "question": "What is the typical initial value for the Q-table in Q-learning?", "options": {"A": "Random values", "B": "Infinity", "C": "Zero", "D": "One"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_44", "setId": "su26_fe", "setTitle": "SU26", "num": 44, "question": "How does coarse coding help in handling large state spaces in reinforcement learning?", "options": {"A": "By dividing the state space into non-overlapping regions", "B": "By using a high-dimensional binary feature vector for each state", "C": "By approximating value functions over a coarsely divided state space", "D": "By applying a hierarchical approach to action selection"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_45", "setId": "su26_fe", "setTitle": "SU26", "num": 45, "question": "In Importance Sampling, why can estimates become highly variable when the behavior policy b differs significantly from the target policy π?", "options": {"A": "Because rewards are always stochastic.", "B": "Because large weights appear when b(x) is small.", "C": "Because policies become deterministic over time.", "D": "Because value functions cannot be normalized properly."}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_46", "setId": "su26_fe", "setTitle": "SU26", "num": 46, "question": "Which property ensures that all states can be reached from any other state in an MDP?", "options": {"A": "Completeness", "B": "Determinism", "C": "Ergodicity", "D": "Consistency"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_47", "setId": "su26_fe", "setTitle": "SU26", "num": 47, "question": "What is the role of the exploration constant C in the Upper Confidence Bound formula used in MCTS?", "options": {"A": "It determines the rate at which new nodes are expanded", "B": "It scales the reward values", "C": "It balances the trade-off between exploration and exploitation", "D": "It controls the depth of the search tree"}, "answer": "C", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_48", "setId": "su26_fe", "setTitle": "SU26", "num": 48, "question": "What role does the target policy play in off-policy learning?", "options": {"A": "It defines the behavior policy", "B": "It defines the policy being learned and improved", "C": "It defines the reward function", "D": "It defines the exploration strategy"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_49", "setId": "su26_fe", "setTitle": "SU26", "num": 49, "question": "Which of the following is a potential drawback of off-policy learning?", "options": {"A": "It requires extensive domain knowledge", "B": "It can lead to instability in learning", "C": "It is computationally inefficient", "D": "It is only suitable for discrete action spaces"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}, {"id": "su26_fe_50", "setId": "su26_fe", "setTitle": "SU26", "num": 50, "question": "Which principle explains why a person might fear all dogs after being bitten by one?", "options": {"A": "Extinction", "B": "Generalization", "C": "Discrimination", "D": "Spontaneous recovery"}, "answer": "B", "explanation": "", "sourceUrl": "https://quizlet.com/vn/1234867796/rel301m_su26_fe_335344-flash-cards/"}], "dupMigration": {"su25_rl_40": "exam_rl_33", "sp26_fe_26": "su25_rl_9", "sp26_fe_29": "su25_rl_13", "su26_fe_40": "su25_rl_31", "su26_fe_16": "sp26_fe_6"}};
    const STORAGE_KEY = 'rel301m_rl_progress_v1';

    function createDefaultProgress() {
      return {
        activeMode: 'learn',
        activeDeck: 'all_rl',
        statusFilter: 'all',
        darkMode: false,
        learnShuffleOpts: false,
        sourceOrderMigrated: true,
        learnAutoNext: true,
        masteryGoal: 2,
        roundSize: 7,
        roundNumber: 1,
        browseHideAnswers: false,
        cards: {},
        examHistory: []
      };
    }

    let memoryFallbackState = createDefaultProgress();

    function loadProgress() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultProgress();
        const parsed = JSON.parse(raw);
        const merged = Object.assign(createDefaultProgress(), parsed, {
          cards: parsed.cards || {},
          examHistory: Array.isArray(parsed.examHistory) ? parsed.examHistory : []
        });
        if (!parsed.sourceOrderMigrated) {
          merged.learnShuffleOpts = false;
          merged.sourceOrderMigrated = true;
        }
        if (STUDY_DATA.dupMigration && merged.cards) {
          Object.keys(STUDY_DATA.dupMigration).forEach(function (oldId) {
            const survId = STUDY_DATA.dupMigration[oldId];
            if (merged.cards[oldId] && !merged.cards[survId]) {
              merged.cards[survId] = merged.cards[oldId];
            }
            delete merged.cards[oldId];
          });
        }
        if (merged.activeMode !== 'learn' && merged.activeMode !== 'exam' && merged.activeMode !== 'browse') {
          merged.activeMode = 'learn';
        }
        return merged;
      } catch (err) {
        return memoryFallbackState;
      }
    }

    let appState = loadProgress();
    let toastTimer = null;
    let autoAdvanceTimer = null;

    function clearAutoAdvance() {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
    }

    function saveProgress() {
      memoryFallbackState = appState;
      const dot = document.getElementById('saveStatusLabel');
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500 inline-block';
      } catch (err) {
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-500 inline-block';
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.classList.add('hidden');
      }, 1800);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getCardProgress(cardId) {
      if (!appState.cards[cardId]) {
        appState.cards[cardId] = {
          status: 'unseen',
          starred: false,
          correctCount: 0,
          wrongCount: 0,
          streak: 0
        };
      }
      return appState.cards[cardId];
    }

    function getCardsByDeck(deckId) {
      if (deckId === 'all_rl') return STUDY_DATA.cards.slice();
      if (deckId === 'weak_only') {
        return STUDY_DATA.cards.filter(function (c) {
          return getCardProgress(c.id).status === 'learning';
        });
      }
      if (deckId === 'traps_only') {
        return STUDY_DATA.cards.filter(function (c) {
          return !!c.trapNote;
        });
      }
      return STUDY_DATA.cards.filter(function (c) {
        return c.setId === deckId;
      });
    }

    function getFilteredCards() {
      const base = getCardsByDeck(appState.activeDeck);
      const f = appState.statusFilter;
      if (f === 'all') return base;
      if (f === 'starred') {
        return base.filter(function (c) { return getCardProgress(c.id).starred; });
      }
      if (f === 'traps') {
        return base.filter(function (c) { return !!c.trapNote; });
      }
      return base.filter(function (c) { return getCardProgress(c.id).status === f; });
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function applyTheme() {
      const root = document.documentElement;
      const moon = document.getElementById('themeIconMoon');
      const sun = document.getElementById('themeIconSun');
      if (appState.darkMode) {
        root.classList.add('dark');
        if (moon) moon.classList.add('hidden');
        if (sun) sun.classList.remove('hidden');
      } else {
        root.classList.remove('dark');
        if (moon) moon.classList.remove('hidden');
        if (sun) sun.classList.add('hidden');
      }
    }

    function renderMasteryDotsHtml(prog) {
      const goal = parseInt(appState.masteryGoal, 10) || 2;
      const filled = prog.status === 'mastered' ? goal : Math.min(goal - 1, prog.streak || (prog.status === 'learning' ? 1 : 0));
      let dots = '';
      for (let i = 0; i < goal; i++) {
        const cls = i < filled
          ? (prog.status === 'mastered' ? 'bg-emerald-500' : 'bg-indigo-500')
          : 'bg-slate-200 dark:bg-slate-700';
        dots += '<span class="w-2 h-2 rounded-full inline-block ' + cls + '"></span>';
      }
      return dots;
    }

    function renderDeckOverview() {
      const deckContainer = document.getElementById('deckPillsContainer');
      const deckOptions = [
        { id: 'all_rl', label: 'All · ' + STUDY_DATA.cards.length }
      ].concat(STUDY_DATA.sets.map(function (s) {
        const cnt = STUDY_DATA.cards.filter(function (c) { return c.setId === s.id; }).length;
        return { id: s.id, label: s.shortTitle + ' · ' + cnt };
      }));

      deckContainer.innerHTML = deckOptions.map(function (d) {
        const active = appState.activeDeck === d.id;
        const cls = active
          ? 'bg-indigo-600 text-white border-indigo-600'
          : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800';
        return '<button type="button" data-deck-select="' + d.id + '" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border transition-colors ' + cls + '">' + escapeHtml(d.label) + '</button>';
      }).join('');

      const linkSpan = document.getElementById('activeDeckSourceLinks');
      if (appState.activeDeck === 'all_rl') {
        linkSpan.innerHTML = '';
      } else {
        const foundSet = STUDY_DATA.sets.find(function (s) { return s.id === appState.activeDeck; });
        linkSpan.innerHTML = foundSet
          ? '<a href="' + escapeHtml(foundSet.url) + '" target="_blank" rel="noopener noreferrer" title="Open Quizlet set" class="px-1.5 py-0.5 rounded hover:bg-indigo-50 dark:hover:bg-indigo-950">↗</a>'
          : '';
      }

      document.querySelectorAll('.status-pill').forEach(function (btn) {
        const val = btn.getAttribute('data-status-filter');
        if (val === appState.statusFilter) {
          btn.className = 'status-pill px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-900 text-white dark:bg-white dark:text-slate-900 transition-colors';
        } else {
          btn.className = 'status-pill px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-900 text-slate-500 border border-slate-200/80 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors';
        }
      });

      const deckCards = getCardsByDeck(appState.activeDeck);
      let mastered = 0, learning = 0, unseen = 0, starred = 0, traps = 0;
      deckCards.forEach(function (c) {
        const p = getCardProgress(c.id);
        if (p.status === 'mastered') mastered++;
        else if (p.status === 'learning') learning++;
        else unseen++;
        if (p.starred) starred++;
        if (c.trapNote) traps++;
      });
      const total = deckCards.length || 1;
      const pct = Math.round((mastered / total) * 100);

      document.getElementById('statMasteredCount').textContent = String(mastered);
      document.getElementById('statLearningCount').textContent = String(learning);
      document.getElementById('statUnseenCount').textContent = String(unseen);
      document.getElementById('statStarredCount').textContent = String(starred);
      document.getElementById('statTrapsCount').textContent = String(traps);
      document.getElementById('statMasteryPercent').textContent = pct + '%';
      document.getElementById('barMastered').style.width = ((mastered / total) * 100).toFixed(1) + '%';
      document.getElementById('barLearning').style.width = ((learning / total) * 100).toFixed(1) + '%';
    }

    // ==================== QUIZLET LEARN ENGINE ====================
    let learnState = {
      queue: [],
      roundCardIds: [],
      passedInRound: 0,
      roundTotal: 0,
      answeredCurrent: false,
      lastOutcomeCorrect: false,
      currentOptionOrder: ['A', 'B', 'C', 'D']
    };

    function startNewLearnRound(incrementRound) {
      clearAutoAdvance();
      if (incrementRound) {
        appState.roundNumber = (appState.roundNumber || 1) + 1;
        saveProgress();
      }

      const pool = getFilteredCards();
      const emptyEl = document.getElementById('learnEmptyState');
      const workEl = document.getElementById('learnWorkspace');
      if (pool.length === 0) {
        emptyEl.classList.remove('hidden');
        workEl.classList.add('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      workEl.classList.remove('hidden');

      const rSize = parseInt(appState.roundSize, 10) || 7;
      // Quizlet Learn priority: Familiar/Learning -> New/Unseen -> Mastered review
      const learningCards = shuffleArray(pool.filter(function (c) { return getCardProgress(c.id).status === 'learning'; }));
      const unseenCards = shuffleArray(pool.filter(function (c) { return getCardProgress(c.id).status === 'unseen'; }));
      const masteredCards = shuffleArray(pool.filter(function (c) { return getCardProgress(c.id).status === 'mastered'; }));
      const prioritized = learningCards.concat(unseenCards, masteredCards).slice(0, rSize);

      learnState.roundCardIds = prioritized.map(function (c) { return c.id; });
      learnState.queue = prioritized.map(function (c) {
        return { cardId: c.id, isRetry: false };
      });
      learnState.passedInRound = 0;
      learnState.roundTotal = learnState.queue.length;
      learnState.answeredCurrent = false;
      prepareCurrentLearnOptions();
      renderLearnView();
    }

    function prepareCurrentLearnOptions() {
      const letters = ['A', 'B', 'C', 'D'];
      learnState.currentOptionOrder = appState.learnShuffleOpts ? shuffleArray(letters) : letters;
    }

    function renderLearnView() {
      const pool = getFilteredCards();
      const emptyEl = document.getElementById('learnEmptyState');
      const workEl = document.getElementById('learnWorkspace');
      if (pool.length === 0 && learnState.queue.length === 0) {
        emptyEl.classList.remove('hidden');
        workEl.classList.add('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      workEl.classList.remove('hidden');

      document.getElementById('learnRoundBadge').textContent = 'R' + (appState.roundNumber || 1);
      const totalInR = learnState.roundTotal || 1;
      const pctR = Math.min(100, Math.round((learnState.passedInRound / totalInR) * 100));
      document.getElementById('learnRoundBar').style.width = pctR + '%';
      document.getElementById('learnRoundProgressText').textContent = learnState.passedInRound + ' / ' + learnState.roundTotal;

      const qCard = document.getElementById('learnQuestionCard');
      const sumCard = document.getElementById('learnRoundSummary');

      if (learnState.queue.length === 0) {
        qCard.classList.add('hidden');
        sumCard.classList.remove('hidden');
        document.getElementById('learnCompleteHeading').textContent = 'Round ' + (appState.roundNumber || 1) + ' complete!';
        const deckCards = getCardsByDeck(appState.activeDeck);
        const masteredCount = deckCards.filter(function (c) { return getCardProgress(c.id).status === 'mastered'; }).length;
        const familiarCount = deckCards.filter(function (c) { return getCardProgress(c.id).status === 'learning'; }).length;
        document.getElementById('learnCompleteSubtext').textContent =
          'Mastered ' + masteredCount + ' · Familiar ' + familiarCount + ' / ' + deckCards.length;

        const recapEl = document.getElementById('learnRoundRecapList');
        recapEl.innerHTML = learnState.roundCardIds.map(function (cid) {
          const c = STUDY_DATA.cards.find(function (x) { return x.id === cid; });
          if (!c) return '';
          const p = getCardProgress(c.id);
          return '<div class="py-2.5 flex items-center justify-between gap-3 text-xs sm:text-sm">' +
            '<div class="min-w-0 flex-1">' +
              '<p class="font-medium truncate text-slate-800 dark:text-slate-200">' + escapeHtml(c.question) + '</p>' +
              '<p class="text-xs text-emerald-600 dark:text-emerald-400 truncate">' + escapeHtml(c.options[c.answer]) + '</p>' +
            '</div>' +
            '<div class="flex items-center gap-1.5 shrink-0">' + renderMasteryDotsHtml(p) + '</div>' +
          '</div>';
        }).join('');

        if (typeof window.confetti === 'function') {
          try { window.confetti({ particleCount: 45, spread: 55, origin: { y: 0.72 } }); } catch (e) {}
        }
        if (window.lucide) {
          try { window.lucide.createIcons(); } catch (e) {}
        }
        return;
      }

      qCard.classList.remove('hidden');
      sumCard.classList.add('hidden');

      const currentItem = learnState.queue[0];
      const card = STUDY_DATA.cards.find(function (c) { return c.id === currentItem.cardId; });
      const prog = getCardProgress(card.id);

      document.getElementById('learnSetBadge').textContent = card.setTitle + ' #' + card.num + (card.alsoIn ? (' · = ' + card.alsoIn) : '');
      document.getElementById('learnMasteryDots').innerHTML = renderMasteryDotsHtml(prog);
      const trapBadge = document.getElementById('learnTrapBadge');
      if (card.trapLabel) {
        trapBadge.textContent = '⚠ ' + card.trapLabel;
        trapBadge.classList.remove('hidden');
      } else {
        trapBadge.classList.add('hidden');
      }

      const retryBadge = document.getElementById('learnRetryBadge');
      if (currentItem.isRetry) retryBadge.classList.remove('hidden');
      else retryBadge.classList.add('hidden');

      document.getElementById('learnSourceLink').href = card.sourceUrl;
      document.getElementById('btnLearnStar').className = prog.starred
        ? 'p-1.5 rounded-lg text-amber-500 bg-amber-50 dark:bg-amber-950/50'
        : 'p-1.5 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-800';

      document.getElementById('learnQuestionText').textContent = card.question;

      document.getElementById('btnLearnDontKnow').classList.remove('hidden');
      document.getElementById('learnPromptHint').textContent = 'Choose matching answer';
